{{ define "main" }}
<style>
  .ticket-wrap { max-width: 600px; margin: 20px auto; padding: 0 20px; }
  .ticket-card { background: rgba(255,255,255,.1); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.15); border-radius: 16px; padding: 24px; }
  .ticket-card h1 { color: #fff; font-size: 22px; margin: 0 0 16px; }
  .ticket-card input, .ticket-card textarea { width: 100%; padding: 10px 12px; margin: 8px 0; border: 1px solid rgba(255,255,255,.2); border-radius: 10px; background: rgba(255,255,255,.1); color: #fff; font-size: 14px; box-sizing: border-box; }
  .ticket-card textarea { min-height: 100px; resize: vertical; }
  .ticket-card input::placeholder, .ticket-card textarea::placeholder { color: rgba(255,255,255,.5); }
  .ticket-card button { padding: 10px 20px; border: none; border-radius: 10px; background: #667eea; color: #fff; font-size: 14px; cursor: pointer; }
  .msg { margin-top: 12px; font-size: 13px; }
  .my-tickets { margin-top: 24px; }
  .my-tickets h2 { color: #fff; font-size: 18px; margin: 0 0 12px; }
  .ticket-item { background: rgba(255,255,255,.06); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .ticket-item .title { color: #fff; font-size: 14px; font-weight: 500; }
  .ticket-item .content { color: #ccc; font-size: 13px; margin: 6px 0; }
  .ticket-item .reply { color: #8ab4ff; font-size: 13px; margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,.1); }
  .status-open { color: #f0ad4e; font-size: 12px; }
  .status-done { color: #8ab4ff; font-size: 12px; }
  .status-closed { color: #999; font-size: 12px; }
  .ticket-meta { font-size: 12px; color: #999; margin-top: 8px; display: flex; gap: 14px; flex-wrap: wrap; }
  .plus { color: #4caf50; }
  .minus { color: #ef5350; }
  .tmpl-btn { margin: 0 6px 6px 0; padding: 6px 12px; font-size: 12px; background: rgba(255,255,255,.1); color: #ccc; border: 1px solid rgba(255,255,255,.15); border-radius: 8px; cursor: pointer; }
  .tmpl-btn:hover { background: rgba(255,255,255,.18); color: #fff; }
</style>

<div class="ticket-wrap">
  <div class="ticket-card">
    <h1>提交工单</h1>
    <div style="margin-bottom:12px;">
      <div style="font-size:13px;color:#aaa;margin-bottom:6px;">快速模板：</div>
      <button class="tmpl-btn" onclick="useTemplate('bug')">Bug反馈</button>
      <button class="tmpl-btn" onclick="useTemplate('suggest')">功能建议</button>
      <button class="tmpl-btn" onclick="useTemplate('appeal')">封禁申诉</button>
      <button class="tmpl-btn" onclick="useTemplate('other')">其他问题</button>
    </div>
    <input type="text" id="title" placeholder="标题" />
    <textarea id="content" placeholder="描述你要反馈的问题或建议"></textarea>
    <button onclick="submitTicket()">提交</button>
    <div class="msg" id="msg"></div>
  </div>
  <div class="my-tickets">
    <h2>我的工单</h2>
    <div id="list"></div>
  </div>
</div>

<script>
function useTemplate(type) {
  const t = document.getElementById('title');
  const c = document.getElementById('content');
  if (type === 'bug') {
    t.value = 'Bug反馈：';
    c.value = '问题描述：\n复现步骤：\n浏览器/设备：\n期望结果：';
  } else if (type === 'suggest') {
    t.value = '功能建议：';
    c.value = '建议内容：\n期望效果：';
  } else if (type === 'appeal') {
    t.value = '封禁申诉：';
    c.value = '我的账号：\n申诉理由：\n相关截图/说明：';
  } else {
    t.value = '';
    c.value = '';
  }
}

async function submitTicket() {
  const t = document.getElementById('title').value.trim();
  const c = document.getElementById('content').value.trim();
  const msg = document.getElementById('msg');
  if (!t || !c) { msg.textContent = '标题和内容不能为空'; return; }
  const res = await fetch('/api/ticket/', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ title: t, content: c }) });
  const data = await res.json();
  if (data.error) {
    msg.textContent = data.error;
    if (res.status === 401 && !window._myId) { setTimeout(function(){ location.href = '/login/'; }, 1500); }
    return;
  }
  msg.textContent = '提交成功（提交扣10积分）';
  document.getElementById('title').value = ''; document.getElementById('content').value = '';
  loadList();
}
window.submitTicket = submitTicket;

function resultLabel(r) {
  if (!r) return '';
  if (r === 'none') return '无需处理';
  if (r === 'fixed') return '已处理';
  if (r === 'useful') return '建议采纳';
  if (r === 'malicious') return '恶意工单';
  return r;
}

function reviewerLabel(t) {
  if (!t.reviewer_name) return '';
  var role = t.reviewer_role === 'super_admin' ? '站长' : (t.reviewer_role === 'admin' ? '管理员' : '');
  return '@' + t.reviewer_name + (role ? '（' + role + '）' : '');
}

function pointsLabel(t) {
  if (t.points_adjust == null) return '';
  if (t.points_adjust > 0) return '<span class="plus">+' + t.points_adjust + ' 积分</span>';
  if (t.points_adjust < 0) return '<span class="minus">' + t.points_adjust + ' 积分</span>';
  return '0 积分';
}

async function loadList() {
  const res = await fetch('/api/ticket/');
  const data = await res.json();
  const el = document.getElementById('list');
  if (!data.tickets || data.tickets.length === 0) { el.innerHTML = '<p style="color:#999;font-size:13px;">还没有工单</p>'; return; }
  el.innerHTML = data.tickets.map(t => {
    var st = t.status === 'open' ? '<span class="status-open">处理中</span>' : t.status === 'done' ? '<span class="status-done">已回复</span>' : '<span class="status-closed">已关闭</span>';
    var archive = t.status === 'closed' ? ('档案编号：' + escapeHtml(t.archive_no || ('T-' + String(t.id).padStart(5, '0')))) : '';
    return `
    <div class="ticket-item">
      <div class="title">${escapeHtml(t.title)} ${st}</div>
      <div class="content">${escapeHtml(t.content)}</div>
      ${t.reply ? `<div class="reply">处理回复：${escapeHtml(t.reply)}</div>` : ''}
      ${t.status === 'closed' ? `<div class="ticket-meta">
        <span>${archive}</span>
        <span>结果：${resultLabel(t.result) || '—'}</span>
        <span>积分：${pointsLabel(t)}</span>
        <span>审核人：${reviewerLabel(t) || '—'}</span>
      </div>` : ''}
    </div>
  `; }).join('');
}

loadList();
</script>
{{ end }}
