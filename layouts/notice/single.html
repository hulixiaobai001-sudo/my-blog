{{ define "main" }}
<style>
  .notice-wrap { max-width: 700px; margin: 30px auto; padding: 0 16px; position: relative; z-index: 1; }
  .notice-item { background: rgba(255,255,255,.08); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.12); border-radius: 16px; padding: 20px; margin-bottom: 16px; cursor: pointer; transition: transform .2s; }
  .notice-item:hover { transform: translateY(-2px); }
  .notice-item h2 { color: #fff; font-size: 18px; margin: 0 0 8px; }
  .notice-item .time { color: #999; font-size: 12px; }
  .notice-item .preview { color: #ccc; font-size: 14px; margin-top: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .empty { color: #888; text-align: center; padding: 60px 0; font-size: 15px; }
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 100; overflow-y: auto; }
  .modal.open { display: flex; justify-content: center; align-items: flex-start; padding: 140px 20px 120px; }
  .modal-content { background: rgba(30,30,50,.95); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.15); border-radius: 16px; max-width: 700px; width: 100%; padding: 30px; position: relative; }
  .modal-content h2 { color: #fff; font-size: 22px; margin: 0 0 8px; }
  .modal-content .date { color: #999; font-size: 12px; margin-bottom: 16px; }
  .modal-content .body { color: #ddd; font-size: 15px; line-height: 1.8; word-break: break-word; }
  .close-btn { position: absolute; top: 12px; right: 16px; background: rgba(255,255,255,.1); border: none; color: #fff; font-size: 20px; cursor: pointer; width: 32px; height: 32px; border-radius: 50%; line-height: 1; z-index: 10; }
</style>

<div class="notice-wrap">
  <h1 style="color:#fff;font-size:24px;margin:0 0 20px;text-align:center;">公告</h1>
  <div id="notice-list"></div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeNoticeModal()">&times;</button>
    <h2 id="modal-title"></h2>
    <div class="date" id="modal-date"></div>
    <div class="body" id="modal-body"></div>
  </div>
</div>

<script>
let notices = [];
function fmtTime(t) {
  if (!t) return '';
  const d = new Date(t.replace(' ', 'T') + '+08:00');
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function stripMd(s) { return String(s || '').replace(/!\[[^\]]*\]\([^)]*\)/g, '[图]').replace(/[#*`>\-]/g, '').slice(0, 80); }

(async () => {
  const res = await fetch('/api/blog/?type=notice');
  const data = await res.json();
  const el = document.getElementById('notice-list');
  if (!data.posts || data.posts.length === 0) {
    el.innerHTML = '<p class="empty">暂无公告</p>';
    return;
  }
  notices = data.posts;
  el.innerHTML = data.posts.map(p => `
    <div class="notice-item" onclick="openNotice(${p.id})">
      <h2>${window.renderMd ? '' : ''}${p.title.replace(/[<>]/g, '')}</h2>
      <div class="time">${fmtTime(p.created_at)}</div>
      <div class="preview">${stripMd(p.content).replace(/[<>]/g, '')}</div>
    </div>
  `).join('');

  const urlParams = new URLSearchParams(window.location.search);
  const nid = urlParams.get('id');
  if (nid) openNotice(parseInt(nid));
})();

async function openNotice(id) {
  const res = await fetch('/api/blog/' + id);
  const data = await res.json();
  if (!data.post) return;
  document.getElementById('modal-title').textContent = data.post.title;
  document.getElementById('modal-date').textContent = fmtTime(data.post.created_at);
  document.getElementById('modal-body').innerHTML = window.renderMd ? window.renderMd(data.post.content) : String(data.post.content).replace(/[<>]/g, '');
  document.getElementById('modal').classList.add('open');
  history.replaceState(null, '', '/notice/?id=' + id);
}
function closeNoticeModal() {
  document.getElementById('modal').classList.remove('open');
  history.replaceState(null, '', '/notice/');
}
</script>
{{ end }}
