{{ if not .IsHome }}
<style>
  :root {
    --bg: #1a1a2e;
    --entry: rgba(255,255,255,.08);
    --primary: #fff;
    --content: #e8e8e8;
    --secondary: #aaa;
    --border: rgba(255,255,255,.1);
  }
  body {
    background: #1a1a2e !important;
    color: var(--content) !important;
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0;
    background: url('/images/bg-inner.jpg') center/cover no-repeat;
  }
  body::after {
    content: ''; position: fixed; inset: 0; z-index: 0;
    background: rgba(0,0,0,.5);
  }
  #top-bar, .post-tags, .nav, .container, .main, .footer, .searchbar, .post {
    position: relative; z-index: 1;
  }
  .about-scroll, .admin-scroll {
    scroll-snap-type: x proximity !important;
    scroll-behavior: smooth;
    touch-action: pan-x pan-y;
  }

  /* 导航栏毛玻璃 */
  .header {
    background: rgba(20,22,35,.7) !important;
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border: 1px solid rgba(255,255,255,.1) !important;
    border-radius: 16px !important;
    padding: 12px 24px !important;
    margin-bottom: 20px !important;
    position: sticky; top: 10px; z-index: 50;
  }
  .header a { color: #fff !important; }

  .container {
    max-width: 900px !important;
    margin: 0 auto;
  }
  h1, h2, h3, h4, h5, h6 { color: #fff !important; }
  p, li, span, div { color: var(--content); }
  a { color: #8ab4ff !important; }
  a:hover { color: #fff !important; }

  .footer { background: transparent !important; backdrop-filter: none; border: none !important; text-align: center; }
  .footer a { color: #8ab4ff !important; }

  .icp-beian {
    display: inline-block; margin-top: 10px; padding: 4px 14px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08);
    border-radius: 20px; font-size: 12px; color: #888 !important;
    text-decoration: none; transition: all .2s;
  }
  .icp-beian:hover { color: #ccc !important; box-shadow: 0 0 10px rgba(255,255,255,.15); }

  .post-entry, .group {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .post-entry:hover { background: rgba(255,255,255,.12); }
  .post-entry .entry-header h2 a { color: #fff !important; }
  .post-entry .post-content, .post-entry .entry-footer { color: #ccc !important; }

  table { background: rgba(255,255,255,.05); border-radius: 8px; }
  th, td { border-color: rgba(255,255,255,.1) !important; color: var(--content); }
  blockquote {
    background: rgba(138,180,255,.1);
    border-left: 3px solid #8ab4ff;
    color: #ccc;
  }
  code, pre { background: rgba(0,0,0,.4) !important; color: #e8e8e8; }

  /* 隐藏原菜单中不需要的项，用JS重建 */
  #menu.menu li { display: none; }
  #menu.menu li.nav-keep { display: inline-block; }

  /* 更多下拉 */
  .more-dropdown { position: relative; display: inline-block; }
  .more-dropdown-content {
    display: none; position: absolute; right: 0; top: 100%;
    background: rgba(20,22,35,.95); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.12); border-radius: 12px;
    min-width: 140px; padding: 8px 0; z-index: 100;
  }
  .more-dropdown.open .more-dropdown-content { display: block; }
  .more-dropdown-content a {
    display: block; padding: 10px 18px; color: #ddd !important; text-decoration: none; font-size: 14px;
  }
  .more-dropdown-content a:hover { background: rgba(255,255,255,.08); color: #fff !important; }

  /* 用户头像下拉 */
  #user-menu {
    position: fixed; right: 20px; top: 14px; z-index: 60;
    display: flex; align-items: center; gap: 8px;
    background: rgba(20,22,35,.7); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.12); border-radius: 20px;
    padding: 4px 12px 4px 4px; cursor: pointer;
  }
  #user-menu .avatar-mini {
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: #fff; font-weight: 600;
  }
  #user-menu .uname { font-size: 13px; color: #fff; }
  #user-menu .dropdown-arrow { font-size: 10px; color: #aaa; }
  #user-menu-content {
    display: none; position: absolute; right: 0; top: 110%;
    background: rgba(20,22,35,.95); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.12); border-radius: 12px;
    min-width: 160px; padding: 8px 0; z-index: 100;
  }
  #user-menu.open #user-menu-content { display: block; }
  #user-menu-content a, #user-menu-content button {
    display: block; width: 100%; text-align: left;
    padding: 10px 18px; color: #ddd; text-decoration: none;
    font-size: 14px; background: none; border: none; cursor: pointer;
  }
  #user-menu-content a:hover, #user-menu-content button:hover {
    background: rgba(255,255,255,.08); color: #fff;
  }

  @media (max-width: 768px) {
    .container { padding: 10px !important; }
    .header { padding: 10px 16px !important; }
    #user-menu { right: 10px; top: 10px; }
  }
</style>
<script>
(function() {
  const menu = document.getElementById('menu');
  if (!menu) return;
  const items = menu.querySelectorAll('li');
  items.forEach(li => {
    const a = li.querySelector('a span, a');
    const text = (a.textContent || '').trim();
    if (['博客','返图墙','个人'].includes(text)) {
      li.classList.add('nav-keep');
    }
  });

  // 加"更多"下拉
  const moreLi = document.createElement('li');
  moreLi.className = 'nav-keep more-dropdown';
  moreLi.innerHTML = '<a href="javascript:void(0)" onclick="event.stopPropagation();this.parentElement.classList.toggle(\'open\')">更多 ▾</a>' +
    '<div class="more-dropdown-content">' +
    '<a href="/links/">友链</a>' +
    '<a href="/notice/">公告</a>' +
    '<a href="/ticket/">工单</a>' +
    '</div>';
  menu.appendChild(moreLi);

  // 点页面其他地方关闭下拉
  document.addEventListener('click', () => {
    document.querySelectorAll('.more-dropdown.open, #user-menu.open').forEach(el => el.classList.remove('open'));
  });
})();
</script>
<script>
(async function() {
  try {
    const res = await fetch('/api/auth/me');
    const data = await res.json();
    const old = document.getElementById('auth-status');
    if (old) old.remove();

    const wrap = document.createElement('div');
    wrap.id = 'user-menu';
    if (data.user) {
      const initial = data.user.username.charAt(0).toUpperCase();
      let extra = '';
      if (data.user.is_admin) extra = '<a href="/admin/">站长后台</a>';
      wrap.innerHTML =
        '<div class="avatar-mini">' + initial + '</div>' +
        '<span class="uname">' + data.user.username + '</span>' +
        '<span class="dropdown-arrow">▾</span>' +
        '<div id="user-menu-content">' +
        extra +
        '<a href="/profile/">我的积分</a>' +
        '<a href="/shop/">积分商店</a>' +
        '<button id="logout-btn">退出登录</button>' +
        '</div>';
      wrap.onclick = (e) => { e.stopPropagation(); wrap.classList.toggle('open'); };
      wrap.querySelector('#logout-btn').onclick = async (e) => {
        e.stopPropagation();
        await fetch('/api/auth/logout', { method: 'POST' });
        location.href = '/';
      };
    } else {
      wrap.innerHTML =
        '<div class="avatar-mini">?</div>' +
        '<span class="uname">未登录</span>' +
        '<span class="dropdown-arrow">▾</span>' +
        '<div id="user-menu-content">' +
        '<a href="/login/">登录 / 注册</a>' +
        '</div>';
      wrap.onclick = () => { location.href = '/login/'; };
    }
    document.body.appendChild(wrap);
  } catch(e) {}
})();

// 注入页脚备案
(function() {
  const footer = document.querySelector('.footer');
  if (footer) {
    const a = document.createElement('a');
    a.href = 'https://icp.gov.moe/?keyword=20260855';
    a.target = '_blank';
    a.className = 'icp-beian';
    a.textContent = '萌ICP备20260855号';
    footer.appendChild(document.createElement('br'));
    footer.appendChild(a);
  }
})();
</script>
{{ end }}
