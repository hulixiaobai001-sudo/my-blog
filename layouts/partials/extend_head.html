<script>
// 轻量安全 Markdown 渲染（正文插图/标题/加粗/列表/链接/代码块），先整体转义再放行白名单标签
window.renderMd = function(src) {
  const esc = String(src || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  let h = esc
    .replace(/```([\s\S]*?)```/g, '<pre style="background:rgba(0,0,0,.35);padding:12px;border-radius:10px;overflow-x:auto;font-size:13px;">$1</pre>')
    .replace(/!\[([^\]]*)\]\((https?:\/\/[^)\s]+)\)/g, '<img src="$2" alt="$1" style="max-width:100%;border-radius:10px;margin:10px 0;" loading="lazy">')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener" style="color:#8ab4ff;">$1</a>')
    .replace(/^### (.*)$/gm, '<h4 style="color:#fff;margin:14px 0 6px;font-size:15px;">$1</h4>')
    .replace(/^## (.*)$/gm, '<h3 style="color:#fff;margin:16px 0 6px;font-size:16px;">$1</h3>')
    .replace(/^# (.*)$/gm, '<h2 style="color:#fff;margin:18px 0 8px;font-size:18px;">$1</h2>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/^[-*] (.*)$/gm, '<div style="padding-left:1em;margin:4px 0;">• $1</div>')
    .replace(/\n/g, '<br>');
  return h;
};
</script>

function makeDraggable(el) {
  el.style.position = 'fixed';
  el.style.zIndex = '95';
  el.style.cursor = 'grab';
  el.style.touchAction = 'none';
  el.style.userSelect = 'none';
  var dragging = false, moved = false, sx, sy, ox, oy;
  el.addEventListener('mousedown', function(e) {
    e.preventDefault();
    dragging = true; moved = false;
    sx = e.clientX; sy = e.clientY;
    var r = el.getBoundingClientRect();
    ox = r.left; oy = r.top;
  });
  el.addEventListener('touchstart', function(e) {
    e.preventDefault();
    dragging = true; moved = false;
    var t = e.touches[0];
    sx = t.clientX; sy = t.clientY;
    var r = el.getBoundingClientRect();
    ox = r.left; oy = r.top;
  }, { passive: false });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) moved = true;
    el.style.left = Math.max(0, Math.min(ox + dx, window.innerWidth - el.offsetWidth)) + 'px';
    el.style.top = Math.max(0, Math.min(oy + dy, window.innerHeight - el.offsetHeight)) + 'px';
    el.style.right = 'auto';
  });
  document.addEventListener('touchmove', function(e) {
    if (!dragging) return;
    e.preventDefault();
    var t = e.touches[0];
    var dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) moved = true;
    el.style.left = Math.max(0, Math.min(ox + dx, window.innerWidth - el.offsetWidth)) + 'px';
    el.style.top = Math.max(0, Math.min(oy + dy, window.innerHeight - el.offsetHeight)) + 'px';
    el.style.right = 'auto';
  }, { passive: false });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false;
    if (moved) {
      var r = el.getBoundingClientRect();
      if (r.left + el.offsetWidth / 2 < window.innerWidth / 2) el.style.left = '8px';
      else el.style.left = (window.innerWidth - el.offsetWidth - 8) + 'px';
    }
  });
  document.addEventListener('touchend', function() {
    if (!dragging) return;
    dragging = false;
    if (moved) {
      var r = el.getBoundingClientRect();
      if (r.left + el.offsetWidth / 2 < window.innerWidth / 2) el.style.left = '8px';
      else el.style.left = (window.innerWidth - el.offsetWidth - 8) + 'px';
    }
  });
}

    var content = prompt('内容：');

    fetch('/api/messages', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ action: 'send', toUserId: window._myId, title: title, content: content }) })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.error) { alert(d.error); return; }
        alert('已发送给自己');
        loadMsgs();
      })
      .catch(function(e) { alert('发送失败'); });
  };

  async function loadMsgs() {
    try {
      var res = await fetch('/api/messages');
      var data = await res.json();
      if (data.error) { panel.innerHTML = '<div style="color:#888;font-size:13px;">登录后查看站内信</div>'; return; }
      var msgs = data.messages || [];
      var unread = msgs.filter(function(m) { return !m.read; }).length;
      if (unread > 0) bell.innerHTML = '📬<span style="position:absolute;top:-2px;right:-2px;width:16px;height:16px;border-radius:50%;background:#e74c3c;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;">' + unread + '</span>';
      else bell.innerHTML = '📬';
      if (msgs.length === 0) { panel.innerHTML = '<div style="color:#666;font-size:13px;text-align:center;padding:20px;">没有站内信</div>'; return; }
      panel.innerHTML = '<div style="color:#fff;font-size:14px;margin-bottom:10px;">站内信（' + unread + '条未读）<button onclick="writeToSelf()" style="float:right;background:none;border:1px solid rgba(255,255,255,.2);color:#8ab4ff;cursor:pointer;font-size:12px;border-radius:6px;padding:2px 8px;">写给自己</button></div>' +
        msgs.map(function(m) {
          var from = m.from_name ? '<span style="color:#8ab4ff;">来自 @' + escapeHtml(m.from_name) + '</span>' : '<span style="color:#666;">系统通知</span>';
          return '<div style="padding:10px;background:' + (m.read ? 'transparent' : 'rgba(102,126,234,.1)') + ';border-radius:8px;margin-bottom:6px;cursor:pointer;" onclick="notifyReadMsg(' + m.id + ')">' +
            '<div style="color:#ddd;font-size:13px;">' + escapeHtml(m.title || '通知') + ' ' + from + ' <button onclick="event.stopPropagation();notifyDelMsg(' + m.id + ')" style="background:none;border:none;color:#dc3545;cursor:pointer;font-size:11px;padding:0;margin-left:4px;">删除</button></div>' +
            '<div style="color:#888;font-size:12px;margin-top:4px;">' + escapeHtml(m.content || '') + '</div>' +
            '<div style="color:#555;font-size:11px;margin-top:4px;">' + m.created_at + '</div>' +
          '</div>';
        }).join('');
    } catch(e) {}
  }

  window.notifyReadMsg = async function(id) {
    await fetch('/api/messages', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ id: id }) });
    loadMsgs();
  };

  window.notifyDelMsg = async function(id) {
    if (!confirm('确定删除这条站内信？')) return;
    var r = await fetch('/api/messages', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ action: 'delete', id: id }) });
    var d = await r.json();
    if (d.error) { alert(d.error); return; }
    loadMsgs();
  };

  setInterval(loadMsgs, 30000);
  loadMsgs();
});

// 全局XSS转义函数
window.escapeHtml = function(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
};

// 音乐播放器
document.addEventListener('DOMContentLoaded', function() {
  const player = document.createElement('div');
  player.id = 'music-player';
  player.innerHTML = '<span class="icon">♪</span>';
  const progress = document.createElement('div');
  progress.id = 'music-progress';
  progress.textContent = '点击播放';
  document.body.appendChild(progress);
  document.body.appendChild(player);

  const audio = new Audio('/music/bgm.wav');
  audio.loop = true;
  audio.volume = 0.4;

  // 恢复上次播放状态
  const wasPlaying = sessionStorage.getItem('bgm_playing') === '1';
  const savedTime = parseFloat(sessionStorage.getItem('bgm_time') || '0');

  function showMsg(t) {
    progress.textContent = t;
    progress.classList.add('show');
    setTimeout(() => progress.classList.remove('show'), 2000);
  }

  if (wasPlaying && savedTime > 0) {
    audio.currentTime = savedTime;
    audio.play().then(() => {
      player.classList.add('playing');
      showMsg('播放中');
    }).catch(() => {});
  }

  const backTop = document.createElement('div');
  backTop.id = 'back-top';
  backTop.textContent = '↑';
  document.body.appendChild(backTop);

  // 恢复悬浮球位置
  var savedPos = localStorage.getItem('fab_pos');
  if (savedPos) {
    var p = JSON.parse(savedPos);
    player.style.left = p.x + 'px';
    player.style.top = p.y + 'px';
    player.style.right = 'auto';
    player.style.bottom = 'auto';
  }

  // 返回顶部
  backTop.onclick = function() { window.scrollTo({ top: 0, behavior: 'smooth' }); };
  window.addEventListener('scroll', function() {
    if (window.scrollY > 300) backTop.classList.add('show');
    else backTop.classList.remove('show');
  });

  // 拖拽逻辑
  var dragging = false, moved = false, startX, startY, origX, origY;
  function getPos(e) {
    if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }
  player.addEventListener('mousedown', startDrag);
  player.addEventListener('touchstart', startDrag, { passive: false });
  function startDrag(e) {
    e.preventDefault();
    dragging = true; moved = false;
    var pos = getPos(e);
    startX = pos.x; startY = pos.y;
    var rect = player.getBoundingClientRect();
    origX = rect.left; origY = rect.top;
  }
  document.addEventListener('mousemove', onDrag);
  document.addEventListener('touchmove', onDrag, { passive: false });
  function onDrag(e) {
    if (!dragging) return;
    e.preventDefault();
    var pos = getPos(e);
    var dx = pos.x - startX, dy = pos.y - startY;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) moved = true;
    var nx = origX + dx, ny = origY + dy;
    nx = Math.max(0, Math.min(nx, window.innerWidth - 48));
    ny = Math.max(0, Math.min(ny, window.innerHeight - 48));
    player.style.left = nx + 'px';
    player.style.top = ny + 'px';
    player.style.right = 'auto';
    player.style.bottom = 'auto';
  }
  document.addEventListener('mouseup', endDrag);
  document.addEventListener('touchend', endDrag);
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    if (moved) {
      var rect = player.getBoundingClientRect();
      var cx = rect.left + 24;
      if (cx < window.innerWidth / 2) {
        player.style.left = '12px';
      } else {
        player.style.left = (window.innerWidth - 60) + 'px';
      }
      localStorage.setItem('fab_pos', JSON.stringify({ x: parseInt(player.style.left), y: parseInt(player.style.top) }));
    }
  }

  // 返回顶部按钮也可拖拽
  var btDragging = false, btMoved = false, btStartX, btStartY, btOrigX, btOrigY;
  backTop.addEventListener('mousedown', btStartDrag);
  backTop.addEventListener('touchstart', btStartDrag, { passive: false });
  function btStartDrag(e) {
    e.preventDefault();
    btDragging = true; btMoved = false;
    var pos = getPos(e);
    btStartX = pos.x; btStartY = pos.y;
    var rect = backTop.getBoundingClientRect();
    btOrigX = rect.left; btOrigY = rect.top;
  }
  document.addEventListener('mousemove', btOnDrag);
  document.addEventListener('touchmove', btOnDrag, { passive: false });
  function btOnDrag(e) {
    if (!btDragging) return;
    e.preventDefault();
    var pos = getPos(e);
    var dx = pos.x - btStartX, dy = pos.y - btStartY;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) btMoved = true;
    var nx = btOrigX + dx, ny = btOrigY + dy;
    nx = Math.max(0, Math.min(nx, window.innerWidth - 36));
    ny = Math.max(0, Math.min(ny, window.innerHeight - 36));
    backTop.style.left = nx + 'px';
    backTop.style.top = ny + 'px';
    backTop.style.right = 'auto';
    backTop.style.bottom = 'auto';
  }
  document.addEventListener('mouseup', btEndDrag);
  document.addEventListener('touchend', btEndDrag);
  function btEndDrag() {
    if (!btDragging) return;
    btDragging = false;
  }
  backTop.addEventListener('click', function(e) {
    if (btMoved) { btMoved = false; return; }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // 点击播放（拖拽后不触发）
  player.addEventListener('click', function(e) {
    if (moved) { moved = false; return; }
    if (!audio.paused) {
      audio.pause();
      player.classList.remove('playing');
      sessionStorage.setItem('bgm_playing', '0');
      showMsg('已暂停');
    } else {
      audio.play();
      player.classList.add('playing');
      sessionStorage.setItem('bgm_playing', '1');
      showMsg('播放中');
    }
  });

  // 定时保存播放位置
  setInterval(() => {
    if (!audio.paused) sessionStorage.setItem('bgm_time', audio.currentTime);
  }, 2000);
});

// ===== 全局 Toast 通知 =====
window.showToast = function(msg, type) {
  type = type || 'info';
  var container = document.getElementById('toast-container');
  if (!container) {
    container = document.createElement('div');
    container.id = 'toast-container';
    document.body.appendChild(container);
  }
  var toast = document.createElement('div');
  toast.className = 'toast ' + type;
  var icons = { success: '✓', error: '✕', warning: '⚠', info: 'ℹ' };
  toast.innerHTML = '<span>' + (icons[type] || 'ℹ') + '</span><span>' + window.escapeHtml(msg) + '</span>';
  container.appendChild(toast);
  setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 3100);
};
// 兼容旧代码：替换 alert
window.alert = function(msg) { window.showToast(String(msg), 'warning'); };

// 全站文章搜索 + 未登录引导条
(function() {
  function esc(str) { return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  // 搜索层
  var sBtn = document.createElement('button');
  sBtn.id = 'site-search-btn';
  sBtn.textContent = '搜索';
  sBtn.style.cssText = 'position:fixed;right:16px;bottom:62px;z-index:980;padding:10px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.45);color:#fff;cursor:pointer;font-size:13px;backdrop-filter:blur(8px);';
  document.body.appendChild(sBtn);

  var mask = document.createElement('div');
  mask.id = 'site-search-mask';
  mask.style.cssText = 'display:none;position:fixed;inset:0;z-index:990;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);padding:60px 20px;overflow-y:auto;';
  mask.innerHTML =
    '<div style="max-width:560px;margin:0 auto;">' +
    '<input id="site-search-input" type="search" placeholder="搜索文章标题或内容..." style="width:100%;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-size:15px;box-sizing:border-box;outline:none;">' +
    '<div id="site-search-results" style="margin-top:14px;"></div>' +
    '</div>';
  document.body.appendChild(mask);

  var postCache = null;
  function loadPosts() {
    if (postCache) return Promise.resolve(postCache);
    return fetch('/index.json').then(function(r) { return r.json(); }).then(function(d) { postCache = d || []; return postCache; }).catch(function() { postCache = []; return postCache; });
  }
  function doSearch() {
    var q = document.getElementById('site-search-input').value.trim().toLowerCase();
    var box = document.getElementById('site-search-results');
    loadPosts().then(function(posts) {
      if (!q) { box.innerHTML = '<div style="color:#888;font-size:13px;text-align:center;padding:20px;">输入关键词搜索全站文章</div>'; return; }
      var hits = posts.filter(function(p) {
        return (p.title || '').toLowerCase().includes(q) || (p.summary || '').toLowerCase().includes(q) || (p.content || '').toLowerCase().includes(q);
      }).slice(0, 20);
      if (!hits.length) { box.innerHTML = '<div style="color:#888;font-size:13px;text-align:center;padding:20px;">没有找到相关文章</div>'; return; }
      box.innerHTML = hits.map(function(p) {
        return '<a href="' + esc(p.permalink) + '" style="display:block;padding:12px 14px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff;text-decoration:none;margin-bottom:8px;">' +
          '<div style="font-size:15px;font-weight:600;">' + esc(p.title) + '</div>' +
          '<div style="font-size:12px;color:#999;margin-top:4px;">' + esc(p.summary.replace(/<[^>]*>/g,'').slice(0,80)) + '</div></a>';
      }).join('');

  sBtn.onclick = function() { mask.style.display = 'block'; setTimeout(function() { document.getElementById('site-search-input').focus(); }, 50); };
  mask.onclick = function(e) { if (e.target === mask) mask.style.display = 'none'; };
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') mask.style.display = 'none'; });
  document.addEventListener('DOMContentLoaded', function() {
    var inp = document.getElementById('site-search-input');
    if (inp) inp.addEventListener('input', doSearch);

  // 维护模式横幅
  fetch('/api/site-settings').then(function(r) { return r.json(); }).then(function(st) {

      document.body.appendChild(bar);
    }

  // 未登录引导条（登录后不显示）

    document.body.appendChild(bar);
    setTimeout(function() { try { bar.style.transition = 'opacity .6s'; bar.style.opacity = '0'; setTimeout(function(){ bar.remove(); }, 600); } catch(e) {} }, 8000);
  }).catch(function() {});
})();

<script>
// 全站图片水印：上传前统一调用，底部半透明条 + 版权声明
window.watermarkImage = function(dataUrl, small) {
  return new Promise(function(resolve) {
    var img = new Image();
    img.onload = function() {
      var maxW = small ? 480 : 1080;
      var w = img.width, h = img.height;
      if (w > maxW) { h = h * maxW / w; w = maxW; }
      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      var ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      var fs = Math.max(small ? 7 : 11, Math.round(w / 56));
      var barH = Math.max(small ? 14 : 26, Math.round(fs * 2.2));
      ctx.fillStyle = 'rgba(0,0,0,.5)';
      ctx.fillRect(0, h - barH, w, barH);
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.textBaseline = 'middle';
      ctx.font = fs + 'px "Microsoft YaHei", sans-serif';
      ctx.fillText('狐狸小白工作室 - 白沁委托授权', 8, h - barH + barH * 0.36);
      ctx.fillStyle = 'rgba(255,255,255,.68)';
      ctx.font = Math.max(8, Math.round(fs * .8)) + 'px "Microsoft YaHei", sans-serif';
      ctx.fillText('版权所有 · 仅供展示使用 · 不可用于其他用途', 8, h - barH + barH * 0.74);
      resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = function() { resolve(dataUrl); };
    img.src = dataUrl;
  });
};
</script>
