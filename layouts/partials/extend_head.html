    // 导航栏头像按钮可拖拽
    setTimeout(function() {
      var all = document.querySelectorAll('body *');
      var avatarBtn = null;
      all.forEach(function(el) {
        if (el.children.length > 2) return;
        var r = el.getBoundingClientRect();
        if (r.width > 30 && r.width < 55 && r.height > 30 && r.height < 55 && r.right > window.innerWidth - 70 && r.top > 55 && r.top < 110) {
          var style = window.getComputedStyle(el);
          if (style.borderRadius === '50%' || style.borderRadius.includes('50%')) {
            avatarBtn = el;
          }
        }
      });
      if (avatarBtn) makeDraggable(avatarBtn);
    }, 1500);
  }
});

function makeDraggable(el) {
  el.style.position = 'fixed';
  el.style.zIndex = '95';
  el.style.cursor = 'grab';
  el.style.touchAction = 'none';
  el.style.userSelect = 'none';
  var dragging = false, moved = false, sx, sy, ox, oy;
  el.addEventListener('mousedown', function(e) {
    e.preventDefault();
    dragging = true; moved = false;
    sx = e.clientX; sy = e.clientY;
    var r = el.getBoundingClientRect();
    ox = r.left; oy = r.top;
  });
  el.addEventListener('touchstart', function(e) {
    e.preventDefault();
    dragging = true; moved = false;
    var t = e.touches[0];
    sx = t.clientX; sy = t.clientY;
    var r = el.getBoundingClientRect();
    ox = r.left; oy = r.top;
  }, { passive: false });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) moved = true;
    el.style.left = Math.max(0, Math.min(ox + dx, window.innerWidth - el.offsetWidth)) + 'px';
    el.style.top = Math.max(0, Math.min(oy + dy, window.innerHeight - el.offsetHeight)) + 'px';
    el.style.right = 'auto';
  });
  document.addEventListener('touchmove', function(e) {
    if (!dragging) return;
    e.preventDefault();
    var t = e.touches[0];
    var dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) moved = true;
    el.style.left = Math.max(0, Math.min(ox + dx, window.innerWidth - el.offsetWidth)) + 'px';
    el.style.top = Math.max(0, Math.min(oy + dy, window.innerHeight - el.offsetHeight)) + 'px';
    el.style.right = 'auto';
  }, { passive: false });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false;
    if (moved) {
      var r = el.getBoundingClientRect();
      if (r.left + el.offsetWidth / 2 < window.innerWidth / 2) el.style.left = '8px';
      else el.style.left = (window.innerWidth - el.offsetWidth - 8) + 'px';
    }
  });
  document.addEventListener('touchend', function() {
    if (!dragging) return;
    dragging = false;
    if (moved) {
      var r = el.getBoundingClientRect();
      if (r.left + el.offsetWidth / 2 < window.innerWidth / 2) el.style.left = '8px';
      else el.style.left = (window.innerWidth - el.offsetWidth - 8) + 'px';
    }
  });
}

// 站内信折叠弹窗
document.addEventListener('DOMContentLoaded', function() {
  var bell = document.createElement('div');
  bell.id = 'msg-bell';
  bell.innerHTML = '📬';
  bell.style.cssText = 'position:fixed;bottom:80px;left:12px;z-index:96;width:40px;height:40px;border-radius:50%;background:rgba(102,126,234,.5);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;';
  document.body.appendChild(bell);

  var panel = document.createElement('div');
  panel.id = 'msg-panel';
  panel.style.cssText = 'position:fixed;top:110px;left:12px;z-index:96;width:300px;max-height:400px;overflow-y:auto;background:rgba(20,20,35,.95);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px;display:none;';
  document.body.appendChild(panel);

  var open = false;
  bell.onclick = function(e) {
    e.stopPropagation();
    open = !open;
    panel.style.display = open ? 'block' : 'none';
    if (open) loadMsgs();
  };
  document.addEventListener('click', function(e) {
    if (!panel.contains(e.target) && e.target !== bell) { open = false; panel.style.display = 'none'; }
  });

  async function loadMsgs() {
    try {
      var res = await fetch('/api/messages');
      var data = await res.json();
      if (data.error) { panel.innerHTML = '<div style="color:#888;font-size:13px;">登录后查看站内信</div>'; return; }
      var msgs = data.messages || [];
      var unread = msgs.filter(function(m) { return !m.read; }).length;
      if (unread > 0) bell.innerHTML = '📬<span style="position:absolute;top:-2px;right:-2px;width:16px;height:16px;border-radius:50%;background:#e74c3c;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;">' + unread + '</span>';
      else bell.innerHTML = '📬';
      if (msgs.length === 0) { panel.innerHTML = '<div style="color:#666;font-size:13px;text-align:center;padding:20px;">没有站内信</div>'; return; }
      panel.innerHTML = '<div style="color:#fff;font-size:14px;margin-bottom:10px;">站内信（' + unread + '条未读）</div>' +
        msgs.map(function(m) {
          return '<div style="padding:10px;background:' + (m.read ? 'transparent' : 'rgba(102,126,234,.1)') + ';border-radius:8px;margin-bottom:6px;cursor:pointer;" onclick="readMsg(' + m.id + ')">' +
            '<div style="color:#ddd;font-size:13px;">' + escapeHtml(m.title || '通知') + '</div>' +
            '<div style="color:#888;font-size:12px;margin-top:4px;">' + escapeHtml(m.content || '') + '</div>' +
            '<div style="color:#555;font-size:11px;margin-top:4px;">' + m.created_at + '</div>' +
          '</div>';
        }).join('');
    } catch(e) {}
  }

  window.readMsg = async function(id) {
    await fetch('/api/messages', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ id: id }) });
    loadMsgs();
  };

  setInterval(loadMsgs, 30000);
  loadMsgs();
});

// 全局XSS转义函数
window.escapeHtml = function(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
};

// 音乐播放器
document.addEventListener('DOMContentLoaded', function() {
  const player = document.createElement('div');
  player.id = 'music-player';
  player.innerHTML = '<span class="icon">♪</span>';
  const progress = document.createElement('div');
  progress.id = 'music-progress';
  progress.textContent = '点击播放';
  document.body.appendChild(progress);
  document.body.appendChild(player);

  const audio = new Audio('/music/bgm.wav');
  audio.loop = true;
  audio.volume = 0.4;

  // 恢复上次播放状态
  const wasPlaying = sessionStorage.getItem('bgm_playing') === '1';
  const savedTime = parseFloat(sessionStorage.getItem('bgm_time') || '0');

  function showMsg(t) {
    progress.textContent = t;
    progress.classList.add('show');
    setTimeout(() => progress.classList.remove('show'), 2000);
  }

  if (wasPlaying && savedTime > 0) {
    audio.currentTime = savedTime;
    audio.play().then(() => {
      player.classList.add('playing');
      showMsg('播放中');
    }).catch(() => {});
  }

  const backTop = document.createElement('div');
  backTop.id = 'back-top';
  backTop.textContent = '↑';
  document.body.appendChild(backTop);

  // 恢复悬浮球位置
  var savedPos = localStorage.getItem('fab_pos');
  if (savedPos) {
    var p = JSON.parse(savedPos);
    player.style.left = p.x + 'px';
    player.style.top = p.y + 'px';
    player.style.right = 'auto';
    player.style.bottom = 'auto';
  }

  // 返回顶部
  backTop.onclick = function() { window.scrollTo({ top: 0, behavior: 'smooth' }); };
  window.addEventListener('scroll', function() {
    if (window.scrollY > 300) backTop.classList.add('show');
    else backTop.classList.remove('show');
  });

  // 拖拽逻辑
  var dragging = false, moved = false, startX, startY, origX, origY;
  function getPos(e) {
    if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }
  player.addEventListener('mousedown', startDrag);
  player.addEventListener('touchstart', startDrag, { passive: false });
  function startDrag(e) {
    e.preventDefault();
    dragging = true; moved = false;
    var pos = getPos(e);
    startX = pos.x; startY = pos.y;
    var rect = player.getBoundingClientRect();
    origX = rect.left; origY = rect.top;
  }
  document.addEventListener('mousemove', onDrag);
  document.addEventListener('touchmove', onDrag, { passive: false });
  function onDrag(e) {
    if (!dragging) return;
    e.preventDefault();
    var pos = getPos(e);
    var dx = pos.x - startX, dy = pos.y - startY;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) moved = true;
    var nx = origX + dx, ny = origY + dy;
    nx = Math.max(0, Math.min(nx, window.innerWidth - 48));
    ny = Math.max(0, Math.min(ny, window.innerHeight - 48));
    player.style.left = nx + 'px';
    player.style.top = ny + 'px';
    player.style.right = 'auto';
    player.style.bottom = 'auto';
  }
  document.addEventListener('mouseup', endDrag);
  document.addEventListener('touchend', endDrag);
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    if (moved) {
      var rect = player.getBoundingClientRect();
      var cx = rect.left + 24;
      if (cx < window.innerWidth / 2) {
        player.style.left = '12px';
      } else {
        player.style.left = (window.innerWidth - 60) + 'px';
      }
      localStorage.setItem('fab_pos', JSON.stringify({ x: parseInt(player.style.left), y: parseInt(player.style.top) }));
    }
  }

  // 返回顶部按钮也可拖拽
  var btDragging = false, btMoved = false, btStartX, btStartY, btOrigX, btOrigY;
  backTop.addEventListener('mousedown', btStartDrag);
  backTop.addEventListener('touchstart', btStartDrag, { passive: false });
  function btStartDrag(e) {
    e.preventDefault();
    btDragging = true; btMoved = false;
    var pos = getPos(e);
    btStartX = pos.x; btStartY = pos.y;
    var rect = backTop.getBoundingClientRect();
    btOrigX = rect.left; btOrigY = rect.top;
  }
  document.addEventListener('mousemove', btOnDrag);
  document.addEventListener('touchmove', btOnDrag, { passive: false });
  function btOnDrag(e) {
    if (!btDragging) return;
    e.preventDefault();
    var pos = getPos(e);
    var dx = pos.x - btStartX, dy = pos.y - btStartY;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) btMoved = true;
    var nx = btOrigX + dx, ny = btOrigY + dy;
    nx = Math.max(0, Math.min(nx, window.innerWidth - 36));
    ny = Math.max(0, Math.min(ny, window.innerHeight - 36));
    backTop.style.left = nx + 'px';
    backTop.style.top = ny + 'px';
    backTop.style.right = 'auto';
    backTop.style.bottom = 'auto';
  }
  document.addEventListener('mouseup', btEndDrag);
  document.addEventListener('touchend', btEndDrag);
  function btEndDrag() {
    if (!btDragging) return;
    btDragging = false;
  }
  backTop.addEventListener('click', function(e) {
    if (btMoved) { btMoved = false; return; }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // 点击播放（拖拽后不触发）
  player.addEventListener('click', function(e) {
    if (moved) { moved = false; return; }
    if (!audio.paused) {
      audio.pause();
      player.classList.remove('playing');
      sessionStorage.setItem('bgm_playing', '0');
      showMsg('已暂停');
    } else {
      audio.play();
      player.classList.add('playing');
      sessionStorage.setItem('bgm_playing', '1');
      showMsg('播放中');
    }
  });

  // 定时保存播放位置
  setInterval(() => {
    if (!audio.paused) sessionStorage.setItem('bgm_time', audio.currentTime);
  }, 2000);
});

// 隐私政策更新弹窗
document.addEventListener('DOMContentLoaded', async function() {
  try {
    const res = await fetch('/api/privacy-version');
    const data = await res.json();
    const ver = data.version;
    const agreed = localStorage.getItem('privacy_ver') || document.cookie.replace(/(?:(?:^|.*;\s*)privacy_ver\s*\=\s*([^;]*).*$)/, '$1');
    if (agreed === ver) return;

    const modal = document.createElement('div');
    modal.id = 'privacy-modal';
    modal.innerHTML =
      '<div id="privacy-box">' +
      '<h3>隐私政策更新通知</h3>' +
      '<p>' + (data.note || '我们的《隐私政策》已更新，请您仔细阅读并同意后继续使用。') + '</p>' +
      '<div class="privacy-btns">' +
      '<button id="privacy-view" onclick="window.open(\'https://my.feishu.cn/docx/PhKsdqFqMoPWxwxQ6wHc5Po0ndh\',\'_blank\')">查看全文</button>' +
      '<button id="privacy-agree">同意并继续</button>' +
      '</div></div>';
    document.body.appendChild(modal);
    setTimeout(() => modal.classList.add('open'), 500);
    modal.querySelector('#privacy-agree').onclick = function() {
      localStorage.setItem('privacy_ver', ver);
      document.cookie = 'privacy_ver=' + ver + ';path=/;max-age=31536000';
      modal.classList.remove('open');
    };
  } catch(e) {}
});
</script>
