{{ define "main" }}
<style>
  .about-wrap {
    max-width: 640px; margin: 20px auto; padding: 0 20px;
    position: relative; z-index: 1;
  }
  .about-card {
    background: rgba(255,255,255,.06);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 20px;
    padding: 36px 28px;
    margin-bottom: 16px;
  }
  .hero { text-align: center; }
  .hero .avatar {
    width: 110px; height: 110px; border-radius: 50%;
    background: rgba(255,255,255,.1); margin: 0 auto 16px;
    overflow: hidden; border: 3px solid rgba(255,255,255,.25);
    box-shadow: 0 0 30px rgba(102,126,234,.3);
  }
  .hero .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .hero h1 { font-size: 26px; margin: 0 0 10px; color: #fff; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
  .badge { background: rgba(255,255,255,.1); padding: 4px 14px; border-radius: 20px; font-size: 13px; color: #ddd; border: 1px solid rgba(255,255,255,.1); }
  .status-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(39,174,96,.15); border: 1px solid rgba(39,174,96,.3); border-radius: 20px; padding: 4px 14px; font-size: 12px; color: #2ecc71; margin-bottom: 16px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #2ecc71; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  h2 { font-size: 17px; margin: 0 0 16px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,.08); color: #fff; }
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .info-item { padding: 10px 14px; background: rgba(255,255,255,.05); border-radius: 10px; font-size: 13px; color: #ddd; }
  .info-item b { color: #888; display: block; font-size: 11px; letter-spacing: 1px; margin-bottom: 3px; }
  .social-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .social-btn { display: block; padding: 12px 14px; background: rgba(255,255,255,.05); border-radius: 12px; text-decoration: none; color: #eee; font-size: 14px; }
  .social-btn small { display: block; color: #888; font-size: 12px; margin-top: 2px; }
  .gallery { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .gallery img { width: 100%; border-radius: 12px; aspect-ratio: 4/3; object-fit: cover; }
  .timeline { padding-left: 20px; position: relative; }
  .timeline::before { content: ''; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 2px; background: rgba(255,255,255,.1); }
  .tl-item { position: relative; padding-bottom: 18px; }
  .tl-item::before { content: ''; position: absolute; left: -19px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: #8ab4ff; }
  .tl-item .date { font-size: 12px; color: #888; }
  .tl-item .event { font-size: 14px; color: #eee; margin-top: 2px; }
  .donate { text-align: center; }
  .donate img { width: 100%; max-width: 240px; border-radius: 12px; margin: 10px auto; }
  .donate p { color: #aaa; font-size: 13px; }
  .quote { background: rgba(138,180,255,.08); border-left: 3px solid #8ab4ff; padding: 12px 16px; border-radius: 0 10px 10px 0; font-size: 13px; color: #ccc; margin-top: 14px; }
</style>

<div class="about-wrap">

  <div class="about-card hero">
    <div><span class="status-badge"><span class="status-dot"></span><span id="about-status">加载中...</span></span></div>
    <div class="avatar"><img src="/images/avatar.jpg" alt="头像"></div>
    <h1 id="cfg-name">加载中...</h1>
    <div class="badges" id="cfg-badges"></div>
  </div>

  <div class="about-card">
    <h2>基本信息</h2>
    <div class="info-grid" id="cfg-info"></div>
    <p style="font-size:13px;color:#aaa;margin-top:14px;" id="cfg-bio"></p>
  </div>

  <div class="about-card">
    <h2>平时在干嘛</h2>
    <div class="info-grid" id="cfg-activities"></div>
    <div class="quote" id="cfg-quote"></div>
  </div>

  <div class="about-card">
    <h2>联系方式</h2>
    <div class="social-grid" id="cfg-contacts"></div>
  </div>

  <div class="about-card">
    <h2>兽装相册</h2>
    <div class="gallery">
      <img src="/images/fursuit-1.jpg" alt="兽聚合照">
      <img src="/images/fursuit-2.jpg" alt="FurShion">
      <img src="/images/fursuit-3.jpg" alt="户外出毛">
    </div>
  </div>

  <div class="about-card">
    <h2>接下来去哪</h2>
    <div class="timeline" id="trips-list">
      <p style="color:#888;font-size:13px;">加载中...</p>
    </div>
  </div>

  <div class="about-card donate">
    <h2>请我喝奶茶</h2>
    <p>如果这个小站让你开心到了，可以请我喝杯奶茶。</p>
    <img src="/images/donate.jpg" alt="赞赏码">
  </div>

</div>
<script>
(async () => {
  const res = await fetch('/api/about-status');
  const data = await res.json();
  document.getElementById('about-status').textContent = data.status || '在线';

  const tr = await fetch('/api/about-trips');
  const td = await tr.json();
  document.getElementById('trips-list').innerHTML = td.trips.map(t =>
    '<div class="tl-item"><div class="date">' + t.date + '</div><div class="event">' + t.event + '</div></div>'
  ).join('');

  const cr = await fetch('/api/about-config');
  const cd = await cr.json();
  const c = cd.config;
  document.getElementById('cfg-name').textContent = c.name;
  document.getElementById('cfg-badges').innerHTML = c.badges.map(b => '<span class="badge">' + b + '</span>').join('');
  document.getElementById('cfg-info').innerHTML = c.info.map(i => '<div class="info-item"><b>' + i.label + '</b>' + i.value + '</div>').join('');
  document.getElementById('cfg-bio').textContent = c.bio;
  document.getElementById('cfg-activities').innerHTML = c.activities.map(i => '<div class="info-item"><b>' + i.label + '</b>' + i.value + '</div>').join('');
  document.getElementById('cfg-quote').textContent = c.quote;
  document.getElementById('cfg-contacts').innerHTML = c.contacts.map(x => '<a class="social-btn" href="' + x.url + '" target="_blank">' + x.name + '<small>' + x.sub + '</small></a>').join('');
})();
</script>
{{ end }}
