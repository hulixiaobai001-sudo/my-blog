{{ define "main" }}
<style>
  .auth-wrap { max-width: 400px; margin: 40px auto; padding: 0 20px; position: relative; z-index: 1; }
  .auth-card { background: rgba(255,255,255,.1); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.15); border-radius: 16px; padding: 30px; }
  .auth-card h1 { color: #fff; font-size: 24px; margin: 0 0 20px; text-align: center; }
  .auth-card input { width: 100%; padding: 12px 14px; margin: 8px 0; border: 1px solid rgba(255,255,255,.2); border-radius: 10px; background: rgba(255,255,255,.1); color: #fff; font-size: 14px; box-sizing: border-box; }
  .auth-card input::placeholder { color: rgba(255,255,255,.5); }
  .auth-card button { width: 100%; padding: 12px; margin-top: 12px; border: none; border-radius: 10px; background: #667eea; color: #fff; font-size: 15px; cursor: pointer; }
  .auth-card button:hover { background: #5568d3; }
  .auth-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .auth-tabs button { flex: 1; background: rgba(255,255,255,.1); color: #ccc; border: 1px solid rgba(255,255,255,.15); margin: 0; }
  .auth-tabs button.active { background: #667eea; color: #fff; }
  .auth-msg { margin-top: 12px; font-size: 13px; text-align: center; }
  .captcha-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .captcha-row img { height: 46px; border-radius: 8px; cursor: pointer; display: block; }
  .captcha-row input { flex: 1; margin: 0; }
  .hidden { display: none; }
</style>

<div class="auth-wrap">
  <div class="auth-card">
    <h1 id="title">登录</h1>
    <div class="auth-tabs">
      <button id="tab-login" class="active" onclick="switchTab('login')">登录</button>
      <button id="tab-register" onclick="switchTab('register')">注册</button>
    </div>
    <input type="text" id="username" placeholder="用户名" />
    <input type="password" id="password" placeholder="密码（至少6位）" />
    <div id="register-fields" class="hidden">
      <input type="text" id="qq" placeholder="QQ号（方便联系）" />
      <div style="display:flex;gap:8px;margin-top:8px;align-items:center;">
        <input type="text" id="phone" placeholder="手机号（短信验证码用，可选）" style="flex:1;margin:0;" />
        <button type="button" id="sms-btn" onclick="sendSms()" style="width:auto;padding:12px 12px;margin:0;white-space:nowrap;background:rgba(255,255,255,.15);">获取验证码</button>
      </div>
      <input type="text" id="sms-code" placeholder="短信验证码" />
      <div class="captcha-row">
        <img id="captcha-img" alt="验证码" title="点击刷新" onclick="genCaptcha()">
        <input type="text" id="captcha" placeholder="图形验证码" />
      </div>
      <div style="display:flex;align-items:flex-start;gap:8px;margin-top:10px;font-size:12px;color:#aaa;text-align:left;">
        <input type="checkbox" id="agree" style="width:16px;height:16px;margin:2px 0 0 0;flex-shrink:0;" />
        <span>我已阅读并同意
          <a href="https://my.feishu.cn/docx/VmeXdDj3kofQJjxC2FqcTvHunab" target="_blank" style="color:#8ab4ff;text-decoration:none;">《用户协议》</a>
          与
          <a href="https://my.feishu.cn/docx/PhKsdqFqMoPWxwxQ6wHc5Po0ndh" target="_blank" style="color:#8ab4ff;text-decoration:none;">《隐私政策》</a>
        </span>
      </div>
    </div>
    <button onclick="submit()">提交</button>
    <div class="auth-msg" id="msg"></div>
    <div style="text-align:center;margin-top:16px;font-size:12px;">
      <a href="https://my.feishu.cn/docx/VmeXdDj3kofQJjxC2FqcTvHunab" target="_blank" style="color:#8ab4ff;text-decoration:none;">用户协议</a>
      <span style="color:#666;margin:0 8px;">·</span>
      <a href="https://my.feishu.cn/docx/PhKsdqFqMoPWxwxQ6wHc5Po0ndh" target="_blank" style="color:#8ab4ff;text-decoration:none;">隐私政策</a>
    </div>
  </div>
</div>

<script>
let mode = 'login';
let captchaToken = '';

async function genCaptcha() {
  const img = document.getElementById('captcha-img');
  img.style.opacity = 0.5;
  try {
    const res = await fetch('/api/auth/captcha');
    const data = await res.json();
    if (data.error) { document.getElementById('msg').textContent = data.error; img.style.opacity = 1; return; }
    captchaToken = data.token;
    img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(data.svg)));
    img.style.opacity = 1;
  } catch (e) {
    document.getElementById('msg').textContent = '验证码加载失败，请刷新重试';
    img.style.opacity = 1;
  }
}

function switchTab(m) {
  mode = m;
  document.getElementById('title').textContent = m === 'login' ? '登录' : '注册';
  document.getElementById('tab-login').classList.toggle('active', m === 'login');
  document.getElementById('tab-register').classList.toggle('active', m === 'register');
  document.getElementById('register-fields').classList.toggle('hidden', m !== 'register');
  document.getElementById('msg').textContent = '';
  if (m === 'register') genCaptcha();
}

async function sendSms() {
  const phone = document.getElementById('phone').value.trim();
  if (!/^1\d{10}$/.test(phone)) { document.getElementById('msg').textContent = '请填写正确的11位手机号'; return; }
  const btn = document.getElementById('sms-btn');
  btn.disabled = true;
  try {
    const res = await fetch('/api/auth/sms-send', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ phone }) });
    const data = await res.json();
    if (data.error) { document.getElementById('msg').textContent = data.error; btn.disabled = false; return; }
    document.getElementById('msg').textContent = '验证码已发送，5分钟内有效';
    let s = 60;
    const timer = setInterval(function() {
      s--;
      btn.textContent = s + 's';
      if (s <= 0) { clearInterval(timer); btn.disabled = false; btn.textContent = '获取验证码'; }
    }, 1000);
  } catch (e) {
    document.getElementById('msg').textContent = '短信服务暂不可用';
    btn.disabled = false;
  }
}

async function submit() {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  if (!u || !p) { document.getElementById('msg').textContent = '请填写用户名和密码'; return; }
  if (p.length < 6) { document.getElementById('msg').textContent = '密码至少6位'; return; }
  let body = { username: u, password: p };
  if (mode === 'register') {
    if (!document.getElementById('agree').checked) { document.getElementById('msg').textContent = '请先勾选同意用户协议和隐私政策'; return; }
    const qq = document.getElementById('qq').value.trim();
    if (qq) body.qq = qq;
    const phone = document.getElementById('phone').value.trim();
    const smsCode = document.getElementById('sms-code').value.trim();
    if (phone) {
      if (!/^1\d{10}$/.test(phone)) { document.getElementById('msg').textContent = '请填写正确的11位手机号'; return; }
      body.phone = phone;
    }
    if (smsCode) body.sms_code = smsCode;
    const ans = document.getElementById('captcha').value.trim();
    if (!ans) { document.getElementById('msg').textContent = '请填写图形验证码'; return; }
    body.captcha_token = captchaToken;
    body.captcha_answer = ans;
  }
  const res = await fetch('/api/auth/' + mode, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const data = await res.json();
  if (data.error) {
    document.getElementById('msg').textContent = data.error;
    if (mode === 'register' && (data.error.includes('验证码') || data.error.includes('协议'))) genCaptcha();
    return;
  }
  location.href = '/gallery/';
}
</script>
{{ end }}
