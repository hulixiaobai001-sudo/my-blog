{{ define "main" }}
<style>
  .gallery-wrap { max-width: 1100px; margin: 20px auto; padding: 0 20px; position: relative; z-index: 1; }
  .gallery-title { color: #fff; font-size: 24px; margin: 20px 0; text-align: center; }
  .points-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(240,173,78,.15); border: 1px solid rgba(240,173,78,.3);
    border-radius: 20px; padding: 6px 18px; font-size: 14px; color: #f0ad4e;
  }
  .upload-btn {
    display: inline-block; padding: 10px 24px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; border-radius: 12px; text-decoration: none;
    font-size: 14px; transition: transform .2s, box-shadow .2s;
  }
  .upload-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(102,126,234,.4); color: #fff !important; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 768px) { .two-col { grid-template-columns: 1fr; } }
  .col-panel { background: rgba(255,255,255,.06); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.12); border-radius: 16px; padding: 16px; }
  .col-panel h2 { color: #fff; font-size: 16px; margin: 0 0 12px; padding-left: 10px; border-left: 3px solid #8ab4ff; }
  .slider { position: relative; width: 100%; border-radius: 12px; overflow: hidden; background: rgba(0,0,0,.2); aspect-ratio: 4/3; }
  .slide { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.8s ease; }
  .slide.active { opacity: 1; }
  .slide img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .slide .caption { position: absolute; bottom: 0; left: 0; right: 0; padding: 30px 16px 12px; background: linear-gradient(transparent, rgba(0,0,0,.7)); color: #fff; }
  .slide .caption .who { font-size: 13px; font-weight: 500; }
  .slide .caption .what { font-size: 12px; color: #ccc; margin-top: 3px; }
  .slide .caption .when { font-size: 11px; color: #999; margin-top: 2px; }
  .dots { display: flex; justify-content: center; gap: 6px; margin-top: 12px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.2); cursor: pointer; transition: background 0.3s; }
  .dot.active { background: #8ab4ff; }
  .empty { text-align: center; color: #888; padding: 40px 0; font-size: 13px; }
  .timeline { display: flex; flex-direction: column; gap: 12px; max-height: 600px; overflow-y: auto; }
  .timeline::-webkit-scrollbar { display: none; }
  .tl-item { background: rgba(255,255,255,.05); border-radius: 12px; overflow: hidden; }
  .tl-item img { width: 100%; max-height: 300px; object-fit: cover; display: block; }
  .tl-item .tl-info { padding: 10px 12px; }
  .tl-item .tl-date { color: #8ab4ff; font-size: 11px; }
  .tl-item .tl-caption { color: #ccc; font-size: 12px; margin-top: 3px; }
  .rules-card { background: rgba(255,255,255,.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 16px; margin-bottom: 20px; }
  .rules-card h3 { color: #fff; font-size: 15px; margin: 0 0 10px; }
  .rules-card .rule-line { color: #ccc; font-size: 13px; line-height: 1.8; }
  .detail-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 200; overflow-y: auto; padding: 140px 16px 140px; }
  .detail-modal.open { display: block; }
  .detail-box { max-width: 600px; margin: 0 auto; background: rgba(30,30,50,.95); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.15); border-radius: 16px; padding: 24px; position: relative; }
  .detail-box img.main-img { width: 100%; border-radius: 12px; margin-bottom: 16px; }
  .detail-box h3 { color: #fff; font-size: 18px; margin: 0 0 8px; }
  .detail-meta { color: #999; font-size: 12px; line-height: 2; }
  .detail-meta b { color: #ccc; }
  .close-detail { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,.15); border: none; color: #fff; font-size: 20px; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; z-index: 10; }
  .detail-comments { margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.1); }
  .detail-comments h4 { color: #fff; font-size: 14px; margin: 0 0 10px; }
  .c-item { padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
  .c-item .c-u { color: #8ab4ff; font-size: 12px; }
  .c-item .c-t { color: #666; font-size: 11px; margin-left: 6px; }
  .c-item .c-b { color: #ddd; font-size: 13px; margin-top: 3px; }
  .c-input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.05); color: #fff; margin: 8px 0; box-sizing: border-box; font-size: 13px; }
  .c-btn { padding: 8px 18px; border-radius: 8px; background: rgba(102,126,234,.3); color: #fff; border: none; cursor: pointer; font-size: 13px; }
</style>

<div class="gallery-wrap">
  <div class="col-panel" style="text-align:center;padding:24px;margin-bottom:20px;">
    <h1 style="color:#fff;font-size:24px;margin:0 0 14px;">返图区</h1>
    <span class="points-badge" id="points-badge" style="margin-bottom:14px;display:inline-block;">积分：--</span>
    <div>
      <a href="/report/" class="upload-btn">提交返图</a>
    </div>
  </div>

  <div class="rules-card">
    <h3 onclick="this.parentElement.querySelector('.rule-line').style.display = this.parentElement.querySelector('.rule-line').style.display === 'none' ? 'block' : 'none'" style="cursor:pointer;">积分规则 ▸</h3>
    <div class="rule-line" style="display:none;">
      <div>每上传一张返图并通过审核：+5 分</div>
      <div>每提交一条工单：-10 分</div>
      <div style="margin-top:8px;color:#8ab4ff;">积分兑换：1000 分 = 一杯奶茶 · 1500 分 = 一份周边物料</div>
    </div>
  </div>

  <div class="two-col">
    <div class="col-panel">
      <h2>用户返图</h2>
      <div class="slider" id="slider"></div>
      <div class="dots" id="dots"></div>
    </div>
    <div class="col-panel">
      <h2>站长返图时间线</h2>
      <div class="timeline" id="admin-timeline"></div>
    </div>
  </div>
</div>

<div class="detail-modal" id="detail-modal">
  <div class="detail-box">
    <button class="close-detail" onclick="closeDetail()">&times;</button>
    <img class="main-img" id="d-img" />
    <div style="text-align:right;margin-bottom:12px;">
      <button onclick="downloadWithWatermark()" style="padding:8px 16px;background:rgba(102,126,234,.3);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;">下载图片</button>
    </div>
    <h3 id="d-title"></h3>
    <div class="detail-meta" id="d-meta"></div>
    <div class="detail-comments">
      <h4>评论</h4>
      <div id="d-comment-list"><p style="color:#666;font-size:12px;">还没有评论</p></div>
      <input class="c-input" id="d-comment-text" placeholder="写下评论..." />
      <button class="c-btn" onclick="submitDetailComment()">发送</button>
    </div>
  </div>
</div>

<script>
let slides = [];
let current = 0;
let isAdmin = false;
let currentDetailId = null;
let adminReports = [];

function fmtTime(t) {
  if (!t) return '';
  const d = new Date(t.replace(' ', 'T') + '+08:00');
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ':' + String(d.getSeconds()).padStart(2,'0');
}

function openDetail(i) {
  const s = slides[i];
  currentDetailId = s.id;
  document.getElementById('d-img').src = '/api/report/view?key=' + s.image_key;
  document.getElementById('d-title').textContent = escapeHtml(s.caption || '无配文');
  document.getElementById('d-meta').innerHTML = `
    <div><b>上传人：</b>@${escapeHtml(s.username)}</div>
    <div><b>上传时间：</b>${fmtTime(s.created_at)}</div>
    <div><b>状态：</b>${s.status === 'approved' ? '已通过审核' : s.status === 'pending' ? '审核中' : '未通过'}</div>
    ${s.featured ? '<div style="color:#f0ad4e;margin-top:6px;">⭐ 该返图已受到站长非常喜爱，故此精选</div>' : ''}
    ${s.note ? `<div><b>站长备注：</b>${escapeHtml(s.note)}</div>` : ''}
  `;
  document.getElementById('detail-modal').classList.add('open');
  loadDetailComments(s.id);
}

function openAdminDetailById(id) {
  const r = adminReports.find(x => x.id === id);
  if (r) openAdminDetail(r);
}

function closeDetail() {
  document.getElementById('detail-modal').classList.remove('open');
  currentDetailId = null;
}

function openAdminDetail(r) {
  currentDetailId = r.id;
  document.getElementById('d-img').src = '/api/report/view?key=' + r.image_key;
  document.getElementById('d-title').textContent = escapeHtml(r.caption || '无配文');
  document.getElementById('d-meta').innerHTML = `
    <div><b>上传人：</b>站长-白沁</div>
    <div><b>上传时间：</b>${fmtTime(r.created_at)}</div>
    <div><b>类型：</b>${r.type || '站长返图'}</div>
    ${r.featured ? '<div style="color:#f0ad4e;margin-top:6px;">⭐ 该返图已受到站长非常喜爱，故此精选</div>' : ''}
    ${r.note ? `<div><b>站长备注：</b>${escapeHtml(r.note)}</div>` : ''}
  `;
  document.getElementById('detail-modal').classList.add('open');
  loadDetailComments(r.id);
}

async function loadDetailComments(reportId) {
  const postId = reportId + 100000;
  const res = await fetch('/api/comments/?post_id=' + postId);
  const data = await res.json();
  const el = document.getElementById('d-comment-list');
  if (!data.comments || data.comments.length === 0) {
    el.innerHTML = '<p style="color:#666;font-size:12px;">还没有评论，来抢沙发</p>';
    return;
  }
  el.innerHTML = data.comments.map(c => `
    <div class="c-item">
      <span class="c-u">@${escapeHtml(c.username)}</span><span class="c-t">${fmtTime(c.created_at)}</span>
      <div class="c-b">${escapeHtml(c.content)}</div>
    </div>
  `).join('');
}

async function submitDetailComment() {
  const content = document.getElementById('d-comment-text').value.trim();
  if (!content || !currentDetailId) return;
  const res = await fetch('/api/comments', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ post_id: currentDetailId + 100000, content }) });
  const data = await res.json();
  if (data.error) { alert(data.error); return; }
  document.getElementById('d-comment-text').value = '';
  loadDetailComments(currentDetailId);
}

async function loadGallery() {
  const me = await fetch('/api/auth/me');
  const meData = await me.json();
  isAdmin = !!(meData.user && meData.user.is_admin);
  const meId = meData.user ? meData.user.id : 0;
  if (meData.user) {
    document.getElementById('points-badge').textContent = '我的积分：' + (meData.user.points || 0) + ' 分';
  } else {
    document.getElementById('points-badge').textContent = '登录后查看积分';
  }

  const res = await fetch('/api/report/gallery');
  const data = await res.json();

  const adminEl = document.getElementById('admin-timeline');
  adminReports = data.admin_reports || [];
  if (data.admin_reports && data.admin_reports.length > 0) {
    adminEl.innerHTML = data.admin_reports.map(r => `
      <div class="tl-item" style="cursor:pointer;" onclick="openAdminDetailById(${r.id})">
        <img src="/api/report/view?key=${escapeHtml(r.image_key)}" />
        <div class="tl-info">
          <div class="tl-date">${fmtTime(r.created_at)}</div>
          <div class="tl-caption">${escapeHtml(r.caption || '')}</div>
        </div>
      </div>
    `).join('');
  } else {
    adminEl.innerHTML = '<p class="empty">暂无站长返图</p>';
  }

  slides = data.user_reports || [];
  const slider = document.getElementById('slider');
  const dots = document.getElementById('dots');
  if (slides.length === 0) {
    slider.innerHTML = '<p class="empty">还没有用户返图</p>';
    dots.innerHTML = '';
    return;
  }
  slider.innerHTML = slides.map((s, i) => `
    <div class="slide ${i === 0 ? 'active' : ''}" style="cursor:pointer;" onclick="openDetail(${i})">
      <img src="/api/report/view?key=${s.image_key}" />
      ${(isAdmin || (meId && s.user_id === meId)) ? `<button onclick="event.stopPropagation();delReport(${s.id})" style="position:absolute;top:12px;right:12px;padding:6px 14px;background:rgba(217,83,79,.8);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:12px;">删除</button>` : ''}
      <div class="caption">
        <div class="who">@${escapeHtml(s.username)}</div>
        <div class="what">${escapeHtml(s.caption || '')}</div>
        <div class="when">${fmtTime(s.created_at)}</div>
      </div>
    </div>
  `).join('');
  dots.innerHTML = slides.map((_, i) => `<div class="dot ${i === 0 ? 'active' : ''}" data-i="${i}"></div>`).join('');
  dots.querySelectorAll('.dot').forEach(d => d.onclick = () => goTo(parseInt(d.dataset.i)));
  setInterval(next, 4000);
}

async function delReport(id) {
  if (!confirm('确定删除这张返图？')) return;
  await fetch('/api/report/delete', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ id }) });
  loadGallery();
}

function goTo(i) {
  current = i;
  document.querySelectorAll('.slide').forEach((s, idx) => s.classList.toggle('active', idx === current));
  document.querySelectorAll('.dot').forEach((d, idx) => d.classList.toggle('active', idx === current));
}

function next() { goTo((current + 1) % slides.length); }

async function downloadWithWatermark() {
  const img = document.getElementById('d-img');
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const im = new Image();
  im.crossOrigin = 'anonymous';
  im.onload = function() {
    canvas.width = im.width;
    canvas.height = im.height;
    ctx.drawImage(im, 0, 0);
    ctx.font = Math.floor(im.width / 30) + 'px sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText('ba3pkz.top', 20, Math.floor(im.width / 15));
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/jpeg', 0.9);
    a.download = 'ba3pkz-' + Date.now() + '.jpg';
    a.click();
  };
  im.src = img.src;
}

loadGallery();
</script>
{{ end }}
