{{ define "main" }}
<style>
  .gallery-wrap { max-width: 900px; margin: 0 auto; padding: 20px; position: relative; z-index: 1; }
  .gallery-scroll {
    display: flex; overflow-x: auto; scroll-snap-type: x proximity;
    -webkit-overflow-scrolling: touch; gap: 20px;
  }
  .gallery-scroll::-webkit-scrollbar { display: none; }
  .g-panel {
    flex: 0 0 100%; max-width: 860px; scroll-snap-align: start;
    border-radius: 20px; padding: 20px;
    background: rgba(255,255,255,.06); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.12);
  }
  .g-panel h2 { color: #fff; font-size: 20px; margin: 0 0 16px; }
  .slider { position: relative; width: 100%; border-radius: 16px; overflow: hidden; background: rgba(0,0,0,.2); aspect-ratio: 4/3; }
  .slide { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.8s ease; }
  .slide.active { opacity: 1; }
  .slide img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .slide .caption { position: absolute; bottom: 0; left: 0; right: 0; padding: 40px 20px 16px; background: linear-gradient(transparent, rgba(0,0,0,.7)); color: #fff; }
  .slide .caption .who { font-size: 14px; font-weight: 500; }
  .slide .caption .what { font-size: 13px; color: #ccc; margin-top: 4px; }
  .slide .caption .when { font-size: 11px; color: #999; margin-top: 2px; }
  .dots { display: flex; justify-content: center; gap: 8px; margin-top: 16px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.2); cursor: pointer; transition: background 0.3s; }
  .dot.active { background: #8ab4ff; }
  .empty { text-align: center; color: #888; padding: 60px 0; font-size: 14px; }
  .timeline { display: flex; flex-direction: column; gap: 16px; max-height: 600px; overflow-y: auto; }
  .timeline::-webkit-scrollbar { display: none; }
  .tl-item { background: rgba(255,255,255,.05); border-radius: 12px; overflow: hidden; }
  .tl-item img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
  .tl-item .tl-info { padding: 10px 14px; }
  .tl-item .tl-date { color: #8ab4ff; font-size: 12px; }
  .tl-item .tl-caption { color: #ccc; font-size: 13px; margin-top: 4px; }
  .nav-hint { text-align: center; color: rgba(255,255,255,.3); font-size: 12px; margin-top: 12px; }
</style>

<div class="gallery-wrap">
  <h1 style="color:#fff;text-align:center;font-size:24px;margin:20px 0;">返图墙</h1>
  <div style="text-align:center;margin-bottom:16px;">
    <a href="/report/" style="display:inline-block;padding:8px 20px;background:rgba(138,180,255,.2);color:#8ab4ff;border-radius:10px;text-decoration:none;font-size:13px;">上传我的返图</a>
  </div>
  <div style="background:rgba(255,255,255,.06);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;margin-bottom:20px;">
    <h3 style="color:#fff;font-size:15px;margin:0 0 10px;">积分规则</h3>
    <div style="color:#ccc;font-size:13px;line-height:1.8;">
      <div>每上传一张返图并通过审核：+5 分</div>
      <div>每提交一条工单：-10 分</div>
      <div style="margin-top:8px;color:#8ab4ff;">积分兑换：</div>
      <div>· 1000 分 = 一杯奶茶</div>
      <div>· 1500 分 = 一份周边物料</div>
      <div id="my-points" style="margin-top:12px;color:#f0ad4e;font-size:14px;"></div>
    </div>
  </div>

  <div class="gallery-scroll" id="gScroll">
    <div class="g-panel">
      <h2>用户返图</h2>
      <div class="slider" id="slider"></div>
      <div class="dots" id="dots"></div>
      <div class="nav-hint">← 左右滑动看站长返图 →</div>
    </div>
    <div class="g-panel">
      <h2>站长返图时间线</h2>
      <div class="timeline" id="admin-timeline"></div>
    </div>
  </div>
</div>

<script>
let slides = [];
let current = 0;
let isAdmin = false;

async function loadGallery() {
  const me = await fetch('/api/auth/me');
  const meData = await me.json();
  isAdmin = !!(meData.user && meData.user.is_admin);
  if (meData.user) {
    document.getElementById('my-points').textContent = '我的当前积分：' + (meData.user.points || 0) + ' 分';
  }

  const res = await fetch('/api/report/gallery');
  const data = await res.json();

  const adminEl = document.getElementById('admin-timeline');
  if (data.admin_reports && data.admin_reports.length > 0) {
    adminEl.innerHTML = data.admin_reports.map(r => `
      <div class="tl-item">
        <img src="/api/report/view?key=${r.image_key}" />
        <div class="tl-info">
          <div class="tl-date">${r.created_at}</div>
          <div class="tl-caption">${r.caption || ''}</div>
        </div>
      </div>
    `).join('');
  } else {
    adminEl.innerHTML = '<p class="empty">暂无站长返图</p>';
  }

  slides = data.user_reports || [];
  const slider = document.getElementById('slider');
  const dots = document.getElementById('dots');
  if (slides.length === 0) {
    slider.innerHTML = '<p class="empty">还没有用户返图</p>';
    dots.innerHTML = '';
    return;
  }
  slider.innerHTML = slides.map((s, i) => `
    <div class="slide ${i === 0 ? 'active' : ''}">
      <img src="/api/report/view?key=${s.image_key}" />
      ${isAdmin ? `<button onclick="delReport(${s.id})" style="position:absolute;top:12px;right:12px;padding:6px 14px;background:rgba(217,83,79,.8);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:12px;">删除</button>` : ''}
      <div class="caption">
        <div class="who">@${s.username}</div>
        <div class="what">${s.caption || ''}</div>
        <div class="when">${s.created_at}</div>
      </div>
    </div>
  `).join('');
  dots.innerHTML = slides.map((_, i) => `<div class="dot ${i === 0 ? 'active' : ''}" data-i="${i}"></div>`).join('');
  dots.querySelectorAll('.dot').forEach(d => d.onclick = () => goTo(parseInt(d.dataset.i)));
  setInterval(next, 4000);
}

async function delReport(id) {
  if (!confirm('确定删除这张返图？')) return;
  await fetch('/api/report/delete', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ id }) });
  loadGallery();
}

function goTo(i) {
  current = i;
  document.querySelectorAll('.slide').forEach((s, idx) => s.classList.toggle('active', idx === current));
  document.querySelectorAll('.dot').forEach((d, idx) => d.classList.toggle('active', idx === current));
}

function next() { goTo((current + 1) % slides.length); }

loadGallery();
</script>
{{ end }}
