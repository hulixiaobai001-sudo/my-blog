{{ define "main" }}
<style>
  .gallery-wrap { max-width: 1100px; margin: 20px auto; padding: 0 20px; position: relative; z-index: 1; }
  .gallery-title { color: #fff; font-size: 24px; margin: 20px 0; text-align: center; }
  .points-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(240,173,78,.15); border: 1px solid rgba(240,173,78,.3);
    border-radius: 20px; padding: 6px 18px; font-size: 14px; color: #f0ad4e;
  }
  .upload-btn {
    display: inline-block; padding: 10px 24px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; border-radius: 12px; text-decoration: none;
    font-size: 14px; transition: transform .2s, box-shadow .2s;
  }
  .upload-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(102,126,234,.4); color: #fff !important; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 768px) { .two-col { grid-template-columns: 1fr; } }
  .col-panel { background: rgba(255,255,255,.06); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.12); border-radius: 16px; padding: 16px; }
  .col-panel h2 { color: #fff; font-size: 16px; margin: 0 0 12px; padding-left: 10px; border-left: 3px solid #8ab4ff; }
  .slider { position: relative; width: 100%; border-radius: 12px; overflow: hidden; background: rgba(0,0,0,.2); aspect-ratio: 4/3; }
  .slide { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.8s ease; }
  .slide.active { opacity: 1; }
  .slide img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .slide .caption { position: absolute; bottom: 0; left: 0; right: 0; padding: 30px 16px 12px; background: linear-gradient(transparent, rgba(0,0,0,.7)); color: #fff; }
  .slide .caption .who { font-size: 13px; font-weight: 500; }
  .slide .caption .what { font-size: 12px; color: #ccc; margin-top: 3px; }
  .slide .caption .when { font-size: 11px; color: #999; margin-top: 2px; }
  .dots { display: flex; justify-content: center; gap: 6px; margin-top: 12px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.2); cursor: pointer; transition: background 0.3s; }
  .dot.active { background: #8ab4ff; }
  .empty { text-align: center; color: #888; padding: 40px 0; font-size: 13px; }
  .timeline { display: flex; flex-direction: column; gap: 12px; max-height: 600px; overflow-y: auto; }
  .timeline::-webkit-scrollbar { display: none; }
  .tl-item { background: rgba(255,255,255,.05); border-radius: 12px; overflow: hidden; }
  .tl-item img { width: 100%; max-height: 300px; object-fit: cover; display: block; }
  .tl-item .tl-info { padding: 10px 12px; }
  .tl-item .tl-date { color: #8ab4ff; font-size: 11px; }
  .tl-item .tl-caption { color: #ccc; font-size: 12px; margin-top: 3px; }
  .rules-card { background: rgba(255,255,255,.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 16px; margin-bottom: 20px; }
  .rules-card h3 { color: #fff; font-size: 15px; margin: 0 0 10px; }
  .rules-card .rule-line { color: #ccc; font-size: 13px; line-height: 1.8; }
</style>

<div class="gallery-wrap">
  <div class="col-panel" style="text-align:center;padding:24px;margin-bottom:20px;">
    <h1 style="color:#fff;font-size:24px;margin:0 0 14px;">返图墙</h1>
    <span class="points-badge" id="points-badge" style="margin-bottom:14px;display:inline-block;">积分：--</span>
    <div>
      <a href="/report/" class="upload-btn">提交返图</a>
    </div>
  </div>

  <div class="rules-card">
    <h3 onclick="this.parentElement.querySelector('.rule-line').style.display = this.parentElement.querySelector('.rule-line').style.display === 'none' ? 'block' : 'none'" style="cursor:pointer;">积分规则 ▸</h3>
    <div class="rule-line" style="display:none;">
      <div>每上传一张返图并通过审核：+5 分</div>
      <div>每提交一条工单：-10 分</div>
      <div style="margin-top:8px;color:#8ab4ff;">积分兑换：1000 分 = 一杯奶茶 · 1500 分 = 一份周边物料</div>
    </div>
  </div>

  <div class="two-col">
    <div class="col-panel">
      <h2>用户返图</h2>
      <div class="slider" id="slider"></div>
      <div class="dots" id="dots"></div>
    </div>
    <div class="col-panel">
      <h2>站长返图时间线</h2>
      <div class="timeline" id="admin-timeline"></div>
    </div>
  </div>
</div>

<script>
let slides = [];
let current = 0;
let isAdmin = false;

async function loadGallery() {
  const me = await fetch('/api/auth/me');
  const meData = await me.json();
  isAdmin = !!(meData.user && meData.user.is_admin);
  if (meData.user) {
    document.getElementById('points-badge').textContent = '我的积分：' + (meData.user.points || 0) + ' 分';
  } else {
    document.getElementById('points-badge').textContent = '登录后查看积分';
  }

  const res = await fetch('/api/report/gallery');
  const data = await res.json();

  const adminEl = document.getElementById('admin-timeline');
  if (data.admin_reports && data.admin_reports.length > 0) {
    adminEl.innerHTML = data.admin_reports.map(r => `
      <div class="tl-item">
        <img src="/api/report/view?key=${r.image_key}" />
        <div class="tl-info">
          <div class="tl-date">${r.created_at}</div>
          <div class="tl-caption">${escapeHtml(r.caption || '')}</div>
        </div>
      </div>
    `).join('');
  } else {
    adminEl.innerHTML = '<p class="empty">暂无站长返图</p>';
  }

  slides = data.user_reports || [];
  const slider = document.getElementById('slider');
  const dots = document.getElementById('dots');
  if (slides.length === 0) {
    slider.innerHTML = '<p class="empty">还没有用户返图</p>';
    dots.innerHTML = '';
    return;
  }
  slider.innerHTML = slides.map((s, i) => `
    <div class="slide ${i === 0 ? 'active' : ''}">
      <img src="/api/report/view?key=${s.image_key}" />
      ${isAdmin ? `<button onclick="delReport(${s.id})" style="position:absolute;top:12px;right:12px;padding:6px 14px;background:rgba(217,83,79,.8);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:12px;">删除</button>` : ''}
      <div class="caption">
        <div class="who">@${escapeHtml(s.username)}</div>
        <div class="what">${escapeHtml(s.caption || '')}</div>
        <div class="when">${s.created_at}</div>
      </div>
    </div>
  `).join('');
  dots.innerHTML = slides.map((_, i) => `<div class="dot ${i === 0 ? 'active' : ''}" data-i="${i}"></div>`).join('');
  dots.querySelectorAll('.dot').forEach(d => d.onclick = () => goTo(parseInt(d.dataset.i)));
  setInterval(next, 4000);
}

async function delReport(id) {
  if (!confirm('确定删除这张返图？')) return;
  await fetch('/api/report/delete', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ id }) });
  loadGallery();
}

function goTo(i) {
  current = i;
  document.querySelectorAll('.slide').forEach((s, idx) => s.classList.toggle('active', idx === current));
  document.querySelectorAll('.dot').forEach((d, idx) => d.classList.toggle('active', idx === current));
}

function next() { goTo((current + 1) % slides.length); }

loadGallery();
</script>
{{ end }}
