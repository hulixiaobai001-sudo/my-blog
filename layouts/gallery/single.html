{{ define "main" }}
<style>
  .gallery-wrap { max-width: 800px; margin: 20px auto; padding: 0 20px; position: relative; z-index: 1; }
  .gallery-title { color: #fff; font-size: 24px; margin: 20px 0; text-align: center; }
  .slider {
    position: relative;
    width: 100%;
    border-radius: 20px;
    overflow: hidden;
    background: rgba(255,255,255,.06);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.12);
    aspect-ratio: 4/3;
  }
  .slide {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.8s ease;
  }
  .slide.active { opacity: 1; }
  .slide img {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
  }
  .slide .caption {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 40px 20px 16px;
    background: linear-gradient(transparent, rgba(0,0,0,.7));
    color: #fff;
  }
  .slide .caption .who { font-size: 14px; font-weight: 500; }
  .slide .caption .what { font-size: 13px; color: #ccc; margin-top: 4px; }
  .slide .caption .when { font-size: 11px; color: #999; margin-top: 2px; }
  .dots { display: flex; justify-content: center; gap: 8px; margin-top: 16px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.2); cursor: pointer; transition: background 0.3s; }
  .dot.active { background: #8ab4ff; }
  .empty { text-align: center; color: #888; padding: 60px 0; font-size: 14px; }
</style>

<div class="gallery-wrap">
  <h1 class="gallery-title">返图墙</h1>
  <div style="text-align:center;margin-bottom:16px;">
    <a href="/report/" style="display:inline-block;padding:8px 20px;background:rgba(138,180,255,.2);color:#8ab4ff;border-radius:10px;text-decoration:none;font-size:13px;">上传我的返图</a>
  </div>
  <div style="background:rgba(255,255,255,.06);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;margin-bottom:20px;">
    <h3 style="color:#fff;font-size:15px;margin:0 0 10px;">积分规则</h3>
    <div style="color:#ccc;font-size:13px;line-height:1.8;">
      <div>每上传一张返图并通过审核：+5 分</div>
      <div>每提交一条工单：-10 分</div>
      <div style="margin-top:8px;color:#8ab4ff;">积分兑换：</div>
      <div>· 1000 分 = 一杯奶茶</div>
      <div>· 1500 分 = 一份周边物料</div>
      <div id="my-points" style="margin-top:12px;color:#f0ad4e;font-size:14px;"></div>
    </div>
  </div>
  <div class="slider" id="slider"></div>
  <div class="dots" id="dots"></div>
</div>

<script>
let slides = [];
let current = 0;
let isAdmin = false;

async function loadGallery() {
  const me = await fetch('/api/auth/me');
  const meData = await me.json();
  isAdmin = !!(meData.user && meData.user.is_admin);
  if (meData.user) {
    document.getElementById('my-points').textContent = '我的当前积分：' + (meData.user.points || 0) + ' 分';
  }

  const res = await fetch('/api/report/gallery');
  const data = await res.json();
  slides = data.reports || [];
  const slider = document.getElementById('slider');
  const dots = document.getElementById('dots');
  if (slides.length === 0) {
    slider.innerHTML = '<p class="empty">还没有返图，快去上传第一张吧</p>';
    return;
  }
  slider.innerHTML = slides.map((s, i) => `
    <div class="slide ${i === 0 ? 'active' : ''}">
      <img src="/api/report/view?key=${s.image_key}" />
      ${isAdmin ? `<button onclick="delReport(${s.id})" style="position:absolute;top:12px;right:12px;padding:6px 14px;background:rgba(217,83,79,.8);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:12px;">删除</button>` : ''}
      <div class="caption">
        <div class="who">@${s.username}</div>
        <div class="what">${s.caption || ''}</div>
        <div class="when">${s.created_at}</div>
      </div>
    </div>
  `).join('');
  dots.innerHTML = slides.map((_, i) => `<div class="dot ${i === 0 ? 'active' : ''}" data-i="${i}"></div>`).join('');
  dots.querySelectorAll('.dot').forEach(d => d.onclick = () => goTo(parseInt(d.dataset.i)));
  setInterval(next, 4000);
}

async function delReport(id) {
  if (!confirm('确定删除这张返图？')) return;
  await fetch('/api/report/delete', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ id }) });
  loadGallery();
}

function goTo(i) {
  current = i;
  document.querySelectorAll('.slide').forEach((s, idx) => s.classList.toggle('active', idx === current));
  document.querySelectorAll('.dot').forEach((d, idx) => d.classList.toggle('active', idx === current));
}

function next() { goTo((current + 1) % slides.length); }

loadGallery();
</script>
{{ end }}
