{{ define "main" }}
<style>
  .blog-wrap { max-width: 700px; margin: 20px auto; padding: 0 20px; position: relative; z-index: 1; }
  .blog-wrap h1 { color: #fff; font-size: 24px; margin: 20px 0; }
  .post-card { background: rgba(255,255,255,.08); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.12); border-radius: 16px; padding: 20px; margin-bottom: 14px; cursor: pointer; transition: transform 0.2s; }
  .post-card:hover { transform: translateY(-2px); }
  .post-card h2 { color: #fff; font-size: 18px; margin: 0 0 8px; }
  .post-card .cover { width: 100%; height: 160px; object-fit: cover; border-radius: 10px; margin-bottom: 12px; }
  .post-card .date { color: #999; font-size: 12px; }
  .post-card .preview { color: #ccc; font-size: 14px; margin-top: 8px; }
  .empty { color: #888; text-align: center; padding: 40px 0; font-size: 14px; }
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 100; overflow-y: auto; }
  .modal.open { display: flex; justify-content: center; padding: 40px 20px; }
  .modal-content { background: rgba(30,30,50,.95); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.15); border-radius: 16px; max-width: 700px; width: 100%; padding: 30px; max-height: 85vh; overflow-y: auto; }
  .modal-content h2 { color: #fff; font-size: 22px; margin: 0 0 8px; }
  .modal-content .date { color: #999; font-size: 12px; margin-bottom: 16px; }
  .modal-content .body { color: #ddd; font-size: 15px; line-height: 1.8; white-space: pre-wrap; }
  .close-btn { float: right; background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
  .copy-link-btn { margin-top: 20px; padding: 8px 16px; background: rgba(138,180,255,.2); color: #8ab4ff; border: 1px solid rgba(138,180,255,.3); border-radius: 8px; cursor: pointer; font-size: 13px; }
  .copy-link-btn:hover { background: rgba(138,180,255,.3); }
  .comments { margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,.1); }
  .comments h3 { color: #fff; font-size: 16px; margin-bottom: 12px; }
  .comment-item { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
  .comment-item .c-user { color: #8ab4ff; font-size: 13px; }
  .comment-item .c-time { color: #666; font-size: 11px; margin-left: 8px; }
  .comment-item .c-body { color: #ddd; font-size: 14px; margin-top: 4px; }
  .comment-input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.05); color: #fff; margin: 8px 0; box-sizing: border-box; }
  .comment-btn { padding: 8px 16px; border-radius: 8px; background: rgba(102,126,234,.3); color: #fff; border: none; cursor: pointer; font-size: 13px; }
</style>

<div class="blog-wrap">
  <h1>博客</h1>
  <div id="post-list"></div>
  <div style="text-align:center;margin:20px 0;">
    <button id="load-more" onclick="loadMore()" style="padding:10px 24px;background:rgba(138,180,255,.2);color:#8ab4ff;border:1px solid rgba(138,180,255,.3);border-radius:10px;cursor:pointer;font-size:14px;display:none;">加载更多</button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal()">&times;</button>
    <h2 id="modal-title"></h2>
    <div class="date" id="modal-date"></div>
    <div class="body" id="modal-body"></div>
    <div style="margin-top:20px;display:flex;gap:10px;align-items:center;">
      <button class="copy-link-btn" onclick="likePost()">点赞 <span id="like-count">0</span></button>
      <button class="copy-link-btn" onclick="copyPostLink()">复制文章链接</button>
    </div>
    <div class="comments">
      <h3>评论</h3>
      <div id="comment-list"><p style="color:#666;font-size:13px;">加载中...</p></div>
      <input class="comment-input" id="comment-text" placeholder="写下你的评论..." />
      <button class="comment-btn" onclick="submitComment()">发送</button>
    </div>
  </div>
</div>

<script>
let currentPostId = null;
let offset = 0;
let hasMore = false;

async function loadPosts() {
  offset = 0;
  const res = await fetch('/api/blog/?offset=0');
  const data = await res.json();
  const el = document.getElementById('post-list');
  if (!data.posts || data.posts.length === 0) {
    el.innerHTML = '<p class="empty">📝 还没有文章，去后台写一篇吧</p>';
    document.getElementById('load-more').style.display = 'none';
    return;
  }
  el.innerHTML = data.posts.map(p => `
    <div class="post-card" onclick="openPost(${p.id})">
      ${p.cover_url ? '<img class="cover" src="' + p.cover_url + '">' : ''}
      <h2>${p.title}</h2>
      <div class="date">${p.created_at} ${p.category ? '<span style="color:#8ab4ff;margin-left:8px;">[' + p.category + ']</span>' : ''}</div>
    </div>
  `).join('');
  offset = data.posts.length;
  hasMore = data.has_more;
  document.getElementById('load-more').style.display = hasMore ? 'inline-block' : 'none';

  const urlParams = new URLSearchParams(window.location.search);
  const postId = urlParams.get('post');
  if (postId) openPost(parseInt(postId));
}

async function loadMore() {
  const res = await fetch('/api/blog/?offset=' + offset);
  const data = await res.json();
  const el = document.getElementById('post-list');
  el.innerHTML += data.posts.map(p => `
    <div class="post-card" onclick="openPost(${p.id})">
      ${p.cover_url ? '<img class="cover" src="' + p.cover_url + '">' : ''}
      <h2>${p.title}</h2>
      <div class="date">${p.created_at} ${p.category ? '<span style="color:#8ab4ff;margin-left:8px;">[' + p.category + ']</span>' : ''}</div>
    </div>
  `).join('');
  offset += data.posts.length;
  hasMore = data.has_more;
  document.getElementById('load-more').style.display = hasMore ? 'inline-block' : 'none';
}

async function openPost(id) {
  const res = await fetch('/api/blog/' + id);
  const data = await res.json();
  if (data.post) {
    currentPostId = id;
    document.getElementById('modal-title').textContent = data.post.title;
    document.getElementById('modal-date').textContent = data.post.created_at;
    document.getElementById('modal-body').textContent = data.post.content;
    document.getElementById('modal').classList.add('open');
    history.replaceState(null, '', '/blog/?post=' + id);
    const sr = await fetch('/api/stats/?post_id=' + id);
    const sd = await sr.json();
    document.getElementById('like-count').textContent = sd.likes;
    loadComments(id);
  }
}

async function loadComments(postId) {
  const res = await fetch('/api/comments/?post_id=' + postId);
  const data = await res.json();
  const el = document.getElementById('comment-list');
  if (!data.comments || data.comments.length === 0) {
    el.innerHTML = '<p style="color:#666;font-size:13px;">还没有评论，来抢沙发</p>';
    return;
  }
  el.innerHTML = data.comments.map(c => `
    <div class="comment-item">
      <span class="c-user">@${c.username}</span><span class="c-time">${c.created_at}</span>
      <div class="c-body">${c.content}</div>
    </div>
  `).join('');
}

async function submitComment() {
  const content = document.getElementById('comment-text').value.trim();
  if (!content) return;
  const res = await fetch('/api/comments', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ post_id: currentPostId, content }) });
  const data = await res.json();
  if (data.error) { alert(data.error); return; }
  document.getElementById('comment-text').value = '';
  loadComments(currentPostId);
}

async function likePost() {
  if (!currentPostId) return;
  const res = await fetch('/api/stats/', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ postId: currentPostId }) });
  const data = await res.json();
  if (data.likes !== undefined) {
    document.getElementById('like-count').textContent = data.likes;
  } else {
    alert(data.error || '点赞失败');
  }
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  currentPostId = null;
  history.replaceState(null, '', '/blog/');
}

function copyPostLink() {
  if (!currentPostId) return;
  const url = window.location.origin + '/blog/?post=' + currentPostId;
  navigator.clipboard.writeText(url).then(() => {
    alert('链接已复制：' + url);
  });
}

loadPosts();
</script>
{{ end }}
