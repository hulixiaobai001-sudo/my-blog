{{ define "main" }}
<style>
  .shop-wrap { max-width: 600px; margin: 20px auto; padding: 0 20px; position: relative; z-index: 1; }
  .shop-wrap h1 { color: #fff; font-size: 24px; margin: 20px 0; text-align: center; }
  .shop-item {
    background: rgba(255,255,255,.06); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.12); border-radius: 16px;
    padding: 24px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center;
  }
  .shop-item .name { color: #fff; font-size: 16px; }
  .shop-item .cost { color: #f0ad4e; font-size: 14px; margin-top: 4px; }
  .shop-item .desc { color: #999; font-size: 12px; margin-top: 6px; }
  .redeem-btn {
    padding: 10px 20px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
    cursor: pointer; font-size: 14px; white-space: nowrap;
  }
  .redeem-btn:hover { opacity: .9; }
  .result-msg { text-align: center; margin-top: 16px; font-size: 14px; }
</style>

<div class="shop-wrap">
  <h1>积分商店</h1>
  <div class="my-points" id="my-points" style="text-align:center;margin-bottom:16px;font-size:14px;color:#8ab4ff;"></div>
  <div id="shop-items"><p style="color:#999;text-align:center;">加载中...</p></div>
  <div class="result-msg" id="msg"></div>
</div>

<script>
async function loadItems() {
  const el = document.getElementById('shop-items');
  try {
    const res = await fetch('/api/shop/items');
    const data = await res.json();
    if (!data.items || data.items.length === 0) {
      el.innerHTML = '<p style="color:#999;text-align:center;">商店暂未上架商品，敬请期待</p>';
      return;
    }
    el.innerHTML = '';
    for (const item of data.items) {
      const div = document.createElement('div');
      div.className = 'shop-item';
      div.innerHTML =
        '<div>' +
        '<div class="name">' + item.name + '</div>' +
        '<div class="cost">' + item.cost + ' 分</div>' +
        (item.desc ? '<div class="desc">' + item.desc + '</div>' : '') +
        '</div>' +
        '<button class="redeem-btn" onclick="redeem(\'' + item.name.replace(/'/g, '\\\'') + '\',' + item.cost + ')">立即兑换</button>';
      el.appendChild(div);
    }
  } catch (e) {
    el.innerHTML = '<p style="color:#999;text-align:center;">加载失败</p>';
  }
}

async function redeem(name, cost) {
  if (!confirm('确定兑换「' + name + '」？需要 ' + cost + ' 分')) return;
  const res = await fetch('/api/shop/redeem', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ itemName: name })
  });
  const data = await res.json();
  const msg = document.getElementById('msg');
  if (data.ok) {
    msg.textContent = '兑换成功，等待站长发货！';
    msg.style.color = '#2ecc71';
    loadPoints();
  } else {
    msg.textContent = data.error || '兑换失败';
    msg.style.color = '#e74c3c';
    if (res.status === 401) {
      alert('请先登录后再兑换');
      setTimeout(function(){ location.href = '/login/'; }, 1500);
    } else if (data.error) {
      alert(data.error);
    }
  }
}

async function loadPoints() {
  const el = document.getElementById('my-points');
  try {
    const res = await fetch('/api/auth/me');
    const data = await res.json();
    if (data.user) {
      el.textContent = '我的积分：' + data.user.points + ' 分 · LV' + (data.user.level || 1) + '（活跃度 ' + (data.user.activity || 0) + '）';
    } else {
      el.textContent = '登录后查看积分并兑换';
    }
  } catch(e) { el.textContent = ''; }
}
loadItems();
loadPoints();
</script>
{{ end }}
