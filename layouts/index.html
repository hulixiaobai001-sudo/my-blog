<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Site.Title }}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    body {
      background: url('/images/bg.jpg') center/cover no-repeat fixed;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background: rgba(0,0,0,.35); z-index: 0;
    }
    .card {
      position: relative; z-index: 1;
      background: rgba(255,255,255,.12);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 24px;
      padding: 60px 50px;
      max-width: 640px; width: 100%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,.3);
      color: #fff;
    }
    .avatar {
      width: 90px; height: 90px; border-radius: 50%;
      background: rgba(255,255,255,.2);
      border: 2px solid rgba(255,255,255,.4);
      margin: 0 auto 20px;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .typing {
      font-size: 28px; font-weight: 600; margin-bottom: 10px;
      min-height: 40px; text-shadow: 0 2px 10px rgba(0,0,0,.3);
    }
    .cursor { display: inline-block; width: 2px; height: 1em; background: #fff; vertical-align: middle; animation: blink 1s infinite; margin-left: 2px; }
    @keyframes blink { 0%,50%{opacity:1} 51%,100%{opacity:0} }
    .sub { font-size: 14px; opacity: .8; margin-bottom: 36px; letter-spacing: 2px; }
    .btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .btns a {
      display: block; padding: 14px 8px;
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 12px;
      color: #fff; text-decoration: none; font-size: 15px;
      transition: all .2s;
    }
    .btns a:hover { background: rgba(255,255,255,.3); transform: translateY(-2px); }
    .foot { margin-top: 30px; font-size: 12px; opacity: .6; }
    @media (max-width: 480px) {
      .card { padding: 40px 24px; }
      .typing { font-size: 22px; }
      .btns { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar"><img src="/images/avatar.jpg" alt="白沁"></div>
    <div class="typing"><span id="text"></span><span class="cursor"></span></div>
    <div class="btns" style="margin-top:30px;">
      <a href="/blog">博客</a>
      <a href="/about">个人</a>
      <a href="/announcements">公告</a>
      <a href="/gallery">返图墙</a>
      <a href="/expand">扩列墙</a>
      <a href="/tickets">工单</a>
    </div>
    <div class="foot">© 2026 白沁 BA3PKZ · Powered by Hugo & Cloudflare<br>全站浏览量：<span id="views">...</span></div>
  </div>
  <script>
    const hour = new Date().getHours();
    let msg;
    if (hour >= 6 && hour < 12) msg = "早上好！我是白沁，欢迎光临！";
    else if (hour >= 12 && hour < 18) msg = "下午好！我是白沁，欢迎光临！";
    else if (hour >= 18 && hour < 24) msg = "晚上好！我是白沁，欢迎光临！";
    else msg = "夜深了，我是白沁，还没睡呢。";
    const el = document.getElementById('text');
    let i = 0;
    function type() {
      if (i <= msg.length) { el.textContent = msg.slice(0, i++); setTimeout(type, 120); }
    }
    type();
    fetch('/api/stats/views').then(r => r.json()).then(d => { document.getElementById('views').textContent = d.views; });

    // 隐私政策弹窗
    const PRIVACY_VER = '2026-10-20';
    if (localStorage.getItem('privacy_ver') !== PRIVACY_VER) {
      setTimeout(() => {
        const modal = document.createElement('div');
        modal.style.cssText = 'position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px;';
        modal.innerHTML = '<div style="max-width:440px;background:rgba(30,30,50,.95);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:28px;">' +
          '<h3 style="color:#fff;font-size:18px;margin:0 0 14px;">隐私政策更新通知</h3>' +
          '<p style="color:#ccc;font-size:13px;line-height:1.8;">我们的《隐私政策》已更新。主要变更：明确数据处理主体为<b>狐狸小白工作室</b>，负责人为<b>狐狸白沁</b>，并完善了第三方信息共享说明。请您仔细阅读并同意后继续使用。</p>' +
          '<div style="display:flex;gap:10px;margin-top:20px;">' +
          '<button onclick="window.open(\'https://my.feishu.cn/docx/PhKsdqFqMoPWxwxQ6wHc5Po0ndh\',\'_blank\')" style="flex:1;padding:12px;border-radius:10px;border:none;background:rgba(255,255,255,.1);color:#ccc;cursor:pointer;">查看全文</button>' +
          '<button id="pa" style="flex:1;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;cursor:pointer;">同意并继续</button>' +
          '</div></div>';
        document.body.appendChild(modal);
        modal.querySelector('#pa').onclick = function() {
          localStorage.setItem('privacy_ver', PRIVACY_VER);
          modal.remove();
        };
      }, 800);
    }
  </script>
</body>
</html>
