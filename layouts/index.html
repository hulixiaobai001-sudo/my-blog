<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Site.Title }}</title>
  {{ partial "view-transition.html" . }}
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    body {
      background: url('/images/bg.jpg') center/cover no-repeat fixed;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background: rgba(0,0,0,.35); z-index: 0;
    }
    .card {
      position: relative; z-index: 1;
      background: rgba(255,255,255,.12);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 24px;
      padding: 60px 50px;
      max-width: 640px; width: 100%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,.3);
      color: #fff;
    }
    .avatar {
      width: 90px; height: 90px; border-radius: 50%;
      background: rgba(255,255,255,.2);
      border: 2px solid rgba(255,255,255,.4);
      margin: 0 auto 20px;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .typing {
      font-size: 28px; font-weight: 600; margin-bottom: 10px;
      min-height: 40px; text-shadow: 0 2px 10px rgba(0,0,0,.3);
    }
    .cursor { display: inline-block; width: 2px; height: 1em; background: #fff; vertical-align: middle; animation: blink 1s infinite; margin-left: 2px; }
    @keyframes blink { 0%,50%{opacity:1} 51%,100%{opacity:0} }
    .sub { font-size: 14px; opacity: .8; margin-bottom: 36px; letter-spacing: 2px; }
    .btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .btns a {
      display: block; padding: 14px 8px;
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 12px;
      color: #fff; text-decoration: none; font-size: 15px;
      transition: all .2s;
    }
    .btns a:hover { background: rgba(255,255,255,.3); transform: translateY(-2px); }
    .foot { margin-top: 30px; font-size: 12px; opacity: .6; }
    @media (max-width: 480px) {
      .card { padding: 40px 24px; }
      .typing { font-size: 22px; }
      .btns { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar"><img src="/images/avatar.jpg" alt="白沁"></div>
    <div class="login-line" id="login-line" style="min-height:24px;font-size:14px;opacity:.9;margin-bottom:8px;"></div>
    <div class="typing"><span id="text"></span><span class="cursor"></span></div>
    <div class="btns" style="margin-top:30px;">
      <a href="/blog">博客</a>
      <a href="/about">个人</a>
      <a href="/notice/">公告</a>
      <a href="/gallery">返图墙</a>
      <a href="/expand">扩列墙</a>
      <a href="/tickets">工单</a>
      <a href="javascript:void(0)" onclick="randomExplore()" style="grid-column:span 2;background:linear-gradient(135deg,#667eea,#764ba2);">随机逛逛</a>
    </div>
    <div class="foot">© 2026 白沁 BA3PKZ · Powered by Hugo & Cloudflare<br>全站浏览量：<span id="views">...</span></div>
  </div>
  <script>
    function escapeHtml(str) { return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    const hour = new Date().getHours();
    let msg;
    if (hour >= 6 && hour < 12) msg = "早上好！我是白沁，欢迎光临！";
    else if (hour >= 12 && hour < 18) msg = "下午好！我是白沁，欢迎光临！";
    else if (hour >= 18 && hour < 24) msg = "晚上好！我是白沁，欢迎光临！";
    else msg = "夜深了，我是白沁，还没睡呢。";
    const el = document.getElementById('text');
    let i = 0;
    function type() {
      if (i <= msg.length) { el.textContent = msg.slice(0, i++); setTimeout(type, 120); }
    }
    type();
    fetch('/api/stats/views').then(r => r.json()).then(d => { document.getElementById('views').textContent = d.views; });

    // 登录态显示 + 未登录引导
    fetch('/api/auth/me').then(r => r.json()).then(d => {
      const line = document.getElementById('login-line');
      if (d.user) {
        line.innerHTML = '<a href="/me/" style="color:#fff;text-decoration:none;">欢迎回来，' + escapeHtml(d.user.username) + ' · LV' + (d.user.level || 1) + ' · ' + (d.user.points || 0) + ' 分</a>';
      } else {
        line.innerHTML = '<a href="/login" style="color:#fff;text-decoration:none;">登录</a> <span style="opacity:.7">/</span> <a href="/login" style="color:#fff;text-decoration:none;">注册</a> <span style="opacity:.6;margin-left:6px;">登录后可返图、留言、扩列</span>';
      }
    });

    // 随机逛逛：返图或文章
    window.randomExplore = async function() {
      if (Math.random() < 0.5) {
        const r = await fetch('/api/report/random').then(r => r.json());
        if (r.found) { location.href = '/gallery?id=' + r.id; return; }
      }
      try {
        const xml = await fetch('/sitemap.xml').then(r => r.text());
        const urls = [...xml.matchAll(/<loc>([^<]*\/blog\/[^<]*)<\/loc>/g)].map(m => m[1]);
        if (urls.length) { location.href = urls[Math.floor(Math.random() * urls.length)]; return; }
      } catch(e) {}
      location.href = '/blog';
    };

    // 首页 BGM（后台可配置地址，未配置不显示）
    fetch('/api/site-settings').then(r => r.json()).then(settings => {
      if (!settings.bgm_url) return;
      const btn = document.createElement('button');
      btn.textContent = '♫ 播放 BGM';
      btn.style.cssText = 'position:fixed;right:16px;bottom:16px;z-index:999;padding:10px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.4);color:#fff;cursor:pointer;font-size:13px;backdrop-filter:blur(8px);';
      document.body.appendChild(btn);
      const audio = document.createElement('audio');
      audio.loop = true;
      audio.src = settings.bgm_url;
      const saved = localStorage.getItem('bgm_playing');
      if (saved === '1') { audio.play().catch(()=>{}); btn.textContent = '♫ 暂停 BGM'; }
      btn.onclick = () => {
        if (audio.paused) { audio.play().catch(()=>{}); btn.textContent = '♫ 暂停 BGM'; localStorage.setItem('bgm_playing','1'); }
        else { audio.pause(); btn.textContent = '♫ 播放 BGM'; localStorage.setItem('bgm_playing','0'); }
      };
    });

    // 隐私政策弹窗
    fetch('/api/privacy-version').then(r => r.json()).then(data => {
      const ver = data.version;
      if (localStorage.getItem('privacy_ver') === ver) return;
      setTimeout(() => {
        const modal = document.createElement('div');
        modal.style.cssText = 'position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px;';
        modal.innerHTML = '<div style="max-width:440px;background:rgba(30,30,50,.95);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:28px;">' +
          '<h3 style="color:#fff;font-size:18px;margin:0 0 14px;">隐私政策更新通知</h3>' +
          '<p style="color:#ccc;font-size:13px;line-height:1.8;">' + (data.note || '我们的《隐私政策》已更新，请您仔细阅读并同意后继续使用。') + '</p>' +
          '<div style="display:flex;gap:10px;margin-top:20px;">' +
          '<button onclick="window.open(\'https://my.feishu.cn/docx/PhKsdqFqMoPWxwxQ6wHc5Po0ndh\',\'_blank\')" style="flex:1;padding:12px;border-radius:10px;border:none;background:rgba(255,255,255,.1);color:#ccc;cursor:pointer;">查看全文</button>' +
          '<button id="pa" style="flex:1;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;cursor:pointer;">同意并继续</button>' +
          '</div></div>';
        document.body.appendChild(modal);
        modal.querySelector('#pa').onclick = function() {
          localStorage.setItem('privacy_ver', ver);
          modal.remove();
        };
      }, 800);
    });
  </script>
  <script>
  window.watermarkImage = function(dataUrl, small) {
    return new Promise(function(resolve) {
      var img = new Image();
      img.onload = function() {
        var maxW = small ? 480 : 1080;
        var w = img.width, h = img.height;
        if (w > maxW) { h = h * maxW / w; w = maxW; }
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        var ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        var fs = Math.max(small ? 7 : 11, Math.round(w / 56));
        var barH = Math.max(small ? 14 : 26, Math.round(fs * 2.2));
        ctx.fillStyle = 'rgba(0,0,0,.5)';
        ctx.fillRect(0, h - barH, w, barH);
        ctx.fillStyle = 'rgba(255,255,255,.9)';
        ctx.textBaseline = 'middle';
        ctx.font = fs + 'px "Microsoft YaHei", sans-serif';
        ctx.fillText('狐狸小白工作室 - 白沁委托授权', 8, h - barH + barH * 0.36);
        ctx.fillStyle = 'rgba(255,255,255,.68)';
        ctx.font = Math.max(8, Math.round(fs * .8)) + 'px "Microsoft YaHei", sans-serif';
        ctx.fillText('版权所有 · 仅供展示使用 · 不可用于其他用途', 8, h - barH + barH * 0.74);
        resolve(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = function() { resolve(dataUrl); };
      img.src = dataUrl;
    });
  };
  </script>
</body>
</html>
