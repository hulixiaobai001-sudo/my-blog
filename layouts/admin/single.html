{{ define "main" }}
<style>
  .admin-scroll {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x proximity;
    -webkit-overflow-scrolling: touch;
    gap: 20px;
    padding: 20px;
    max-width: 100vw;
    height: calc(100vh - 120px);
    align-items: stretch;
  }
  .nav-arrow {
    position: fixed; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,255,255,.15); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.2);
    color: #fff; font-size: 20px; cursor: pointer;
    z-index: 100; display: flex; align-items: center; justify-content: center;
  }
  .nav-arrow:hover { background: rgba(255,255,255,.3); }
  .nav-left { left: 10px; }
  .nav-right { right: 10px; }
  .admin-scroll::-webkit-scrollbar { display: none; }
  .panel {
    flex: 0 0 85vw;
    max-width: 420px;
    scroll-snap-align: start;
    border-radius: 20px;
    padding: 28px 24px;
    background: rgba(255,255,255,.08);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border: 1px solid rgba(255,255,255,.12);
    overflow-y: auto;
  }
  .panel::-webkit-scrollbar { display: none; }
  .panel h1 { font-size: 22px; color: #fff; margin: 0 0 16px; }
  .panel h2 { font-size: 16px; color: #fff; margin: 0 0 14px; }
  .report-item { display: flex; gap: 12px; align-items: flex-start; background: rgba(255,255,255,.05); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .report-item img { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; }
  .report-item .info { flex: 1; }
  .report-item .caption { color: #fff; font-size: 13px; }
  .report-item .meta { color: #999; font-size: 11px; margin-top: 3px; }
  .report-item .actions { margin-top: 8px; display: flex; gap: 8px; }
  .report-item .actions button { padding: 5px 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 12px; color: #fff; }
  .btn-approve { background: #5cb85c; }
  .btn-reject { background: #d9534f; }
  .ticket-item { background: rgba(255,255,255,.05); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .ticket-item .title { color: #fff; font-size: 14px; font-weight: 500; }
  .ticket-item .content { color: #ccc; font-size: 13px; margin: 6px 0; }
  .ticket-item .reply-box { width: 100%; padding: 8px; margin-top: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.08); color: #fff; font-size: 13px; box-sizing: border-box; }
  .ticket-item .btn-row { margin-top: 8px; display: flex; gap: 8px; }
  .ticket-item .btn-row button { padding: 6px 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 12px; color: #fff; }
  .btn-reply { background: #667eea; }
  .btn-close { background: #888; }
  .status-open { color: #f0ad4e; font-size: 11px; }
  .status-done { color: #8ab4ff; font-size: 11px; }
  .status-closed { color: #666; font-size: 11px; }
  .status-pending { color: #f0ad4e; font-size: 11px; }
  .status-approved { color: #5cb85c; font-size: 11px; }
  .status-rejected { color: #d9534f; font-size: 11px; }
  .empty { color: #888; font-size: 13px; text-align: center; padding: 20px 0; }
  .hint { color: rgba(255,255,255,.3); font-size: 11px; text-align: center; margin-top: 8px; }
</style>

<div class="admin-scroll" id="adminScroll">
  <div class="panel">
    <h1>站长后台</h1>
    <p style="color:#aaa;font-size:13px;">左右滑动切换功能，电脑端点箭头或用鼠标滚轮。</p>
  </div>

  <div class="panel">
    <h2>返图审核（待处理）</h2>
    <div id="reports"></div>
  </div>

  <div class="panel">
    <h2>工单处理</h2>
    <div id="tickets"></div>
  </div>

  <div class="panel">
    <h2>写博客</h2>
    <input id="blog-title" placeholder="文章标题" style="width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff;font-size:14px;box-sizing:border-box;margin-bottom:10px;" />
    <input id="blog-category" placeholder="分类（如：技术、日常、无线电）" style="width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff;font-size:14px;box-sizing:border-box;margin-bottom:10px;" />
    <textarea id="blog-content" placeholder="正文内容..." style="width:100%;height:200px;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff;font-size:13px;box-sizing:border-box;resize:vertical;"></textarea>
    <button onclick="publishBlog('blog')" style="margin-top:10px;padding:10px 20px;border:none;border-radius:10px;background:#667eea;color:#fff;cursor:pointer;font-size:14px;">发布文章</button>
    <div id="blog-result" style="margin-top:10px;font-size:13px;"></div>
  </div>

  <div class="panel">
    <h2>发公告</h2>
    <input id="notice-title" placeholder="公告标题" style="width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff;font-size:14px;box-sizing:border-box;margin-bottom:10px;" />
    <textarea id="notice-content" placeholder="公告内容..." style="width:100%;height:200px;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff;font-size:13px;box-sizing:border-box;resize:vertical;"></textarea>
    <button onclick="publishBlog('notice')" style="margin-top:10px;padding:10px 20px;border:none;border-radius:10px;background:#e67e22;color:#fff;cursor:pointer;font-size:14px;">发布公告</button>
    <div id="notice-result" style="margin-top:10px;font-size:13px;"></div>
  </div>

  <div class="panel">
    <h2>站长返图上传</h2>
    <input type="file" id="admin-img" accept="image/*" style="width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff;font-size:13px;box-sizing:border-box;margin-bottom:10px;" />
    <input type="date" id="admin-date" style="width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff;font-size:13px;box-sizing:border-box;margin-bottom:10px;" />
    <textarea id="admin-caption" placeholder="配文（比如：绒兽汇 2026）" style="width:100%;height:80px;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff;font-size:13px;box-sizing:border-box;resize:vertical;"></textarea>
    <button onclick="uploadAdminImg()" style="margin-top:10px;padding:10px 20px;border:none;border-radius:10px;background:#27ae60;color:#fff;cursor:pointer;font-size:14px;">上传到时间线</button>
    <div id="admin-img-result" style="margin-top:10px;font-size:13px;"></div>
  </div>
</div>

<button class="nav-arrow nav-left" onclick="scrollAdmin(-1)">&#8249;</button>
<button class="nav-arrow nav-right" onclick="scrollAdmin(1)">&#8250;</button>

<script>
function scrollAdmin(dir) {
  document.getElementById('adminScroll').scrollBy({ left: dir * 400, behavior: 'smooth' });
}
document.addEventListener('DOMContentLoaded', () => {
  const scroller = document.getElementById('adminScroll');
  if (scroller) {
    scroller.addEventListener('wheel', (e) => {
      if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
        e.preventDefault();
        scroller.scrollLeft += e.deltaY;
      }
    }, { passive: false });
  }
});
</script>

<script>
async function checkAdmin() {
  const res = await fetch('/api/auth/me');
  const data = await res.json();
  if (!data.user || !data.user.is_admin) {
    document.querySelector('.admin-scroll').innerHTML = '<div class="panel" style="flex:0 0 85vw;max-width:420px;text-align:center;justify-content:center;display:flex;flex-direction:column;"><h1 style="font-size:20px;">仅站长可访问</h1><p style="color:#aaa;font-size:14px;margin-top:12px;">你没有权限查看此页面。</p></div>';
    return false;
  }
  return true;
}

(async () => {
  if (await checkAdmin()) {
    loadReports();
    loadTickets();
  }
})();

async function loadReports() {
  const res = await fetch('/api/report/moderate');
  const data = await res.json();
  const el = document.getElementById('reports');
  if (!data.reports || data.reports.length === 0) { el.innerHTML = '<p class="empty">没有待审核的返图</p>'; return; }
  el.innerHTML = data.reports.map(r => `
    <div class="report-item">
      <img src="/api/report/view?key=${r.image_key}" />
      <div class="info">
        <div class="caption">${r.caption || '无配文'}</div>
        <div class="meta">${r.username} · ${r.created_at}</div>
        <div class="actions">
          <button class="btn-approve" onclick="moderate(${r.id},'approved')">通过</button>
          <button class="btn-reject" onclick="moderate(${r.id},'rejected')">拒绝</button>
        </div>
      </div>
    </div>
  `).join('');
}

async function moderate(id, status) {
  await fetch('/api/report/moderate', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ id, status }) });
  loadReports();
}

async function loadTickets() {
  const res = await fetch('/api/ticket/');
  const data = await res.json();
  const el = document.getElementById('tickets');
  if (!data.tickets || data.tickets.length === 0) { el.innerHTML = '<p class="empty">没有待处理的工单</p>'; return; }
  el.innerHTML = data.tickets.map(t => `
    <div class="ticket-item">
      <div class="title">${t.title} <span class="status-${t.status}">${t.status === 'open' ? '处理中' : t.status === 'done' ? '已回复' : '已关闭'}</span></div>
      <div class="content">${t.content}</div>
      ${t.reply ? `<div style="color:#8ab4ff;font-size:12px;margin-top:6px;">回复：${t.reply}</div>` : ''}
      <textarea class="reply-box" id="reply-${t.id}" placeholder="回复内容...">${t.reply || ''}</textarea>
      <div class="btn-row">
        <button class="btn-reply" onclick="replyTicket(${t.id},false)">回复</button>
        <button class="btn-close" onclick="replyTicket(${t.id},true)">关闭工单</button>
      </div>
    </div>
  `).join('');
}

async function replyTicket(id, close) {
  const reply = document.getElementById('reply-' + id).value;
  await fetch('/api/ticket/reply', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ id, reply, close }) });
  loadTickets();
}

async function publishBlog(type) {
  const title = document.getElementById(type === 'blog' ? 'blog-title' : 'notice-title').value;
  const content = document.getElementById(type === 'blog' ? 'blog-content' : 'notice-content').value;
  const category = type === 'blog' ? document.getElementById('blog-category').value : '';
  const result = document.getElementById(type === 'blog' ? 'blog-result' : 'notice-result');
  if (!title || !content) { result.textContent = '标题和内容不能为空'; return; }
  result.textContent = '发布中...';
  const body = { title, content, type };
  if (category) body.category = category;
  const res = await fetch('/api/blog/', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  if (res.ok) {
    result.textContent = '发布成功！';
    document.getElementById(type === 'blog' ? 'blog-title' : 'notice-title').value = '';
    document.getElementById(type === 'blog' ? 'blog-content' : 'notice-content').value = '';
  } else {
    result.textContent = '发布失败';
  }
}

async function uploadAdminImg() {
  const file = document.getElementById('admin-img').files[0];
  if (!file) { document.getElementById('admin-img-result').textContent = '请先选图片'; return; }
  const date = document.getElementById('admin-date').value;
  const caption = document.getElementById('admin-caption').value;
  const result = document.getElementById('admin-img-result');
  result.textContent = '压缩中...';
  let blob = file;
  if (file.size > 20 * 1024 * 1024) {
    result.textContent = '图片太大，自动压缩中...';
    blob = await compressImage(file, 0.7);
  }
  result.textContent = '上传中...';
  const fd = new FormData();
  fd.append('file', blob, 'admin.jpg');
  fd.append('admin_date', date);
  fd.append('caption', caption);
  const res = await fetch('/api/report/upload-admin', { method: 'POST', body: fd });
  const data = await res.json();
  if (res.ok && data.ok) {
    result.textContent = '上传成功！';
    document.getElementById('admin-img').value = '';
    document.getElementById('admin-caption').value = '';
  } else {
    result.textContent = '上传失败：' + (data.error || res.status);
  }
}

function compressImage(file, quality) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const maxW = 1920;
      const scale = Math.min(1, maxW / img.width);
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(resolve, 'image/jpeg', quality);
    };
    img.src = URL.createObjectURL(file);
  });
}
</script>
